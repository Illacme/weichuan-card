# 微传名片 · 三端联调（前端 + 后端 + 可选 MySQL）
#
# 两种部署形态任选其一（数据库引擎在安装向导里也能再切换）：
#   1) 零依赖起步（默认，推荐试用 / 小体量内部使用）：
#        docker compose up -d --build
#      → 只起 backend + frontend，浏览器开 http://localhost:8080 进安装向导，
#        选 SQLite 即可，不需要任何数据库口令、也不必起 MySQL 容器。
#   2) 生产用 MySQL：
#        docker compose --profile mysql up -d --build
#      → 额外起 mysql 容器，安装向导自动预填连接信息，选 MySQL 即可。
#      （注意 --profile 是顶层标志，必须放在 up 之前）
#
# 密码等敏感变量通过 .env 注入（见 .env.example）。
# 注意：DB_DSN 中的主机名是 mysql 服务名（仅 --profile mysql 时存在），
#       UPLOAD_BASE_URL 用宿主机访问地址（与 nginx 发布端口一致）。
#
# 首次部署推荐「什么都不填」直接起：DB_DSN / JWT_KEY / ADMIN_PASS 都留空，
# 浏览器打开 http://localhost:8080 会进安装向导，填完自动建库建表、写回配置并重启。
# MYSQL_ROOT_PASSWORD 只有用 MySQL 形态（--profile mysql）时才需要给；
# 缺省时该形态下 mysql 容器会启动即报错退出（日志有明确提示），默认 SQLite 形态不受影响。

# 顶层 name：不依赖目录名推导项目名。若项目放在中文（或其他非 ASCII）目录下，
# compose 默认会把目录名 sanitize 成空项目名而直接报 "project name must not be empty"。
name: weichuan

services:
  mysql:
    # profiles: 默认 docker compose up 不起 mysql（零依赖起步、选 SQLite 不需要它）；
    # 仅 `docker compose --profile mysql up` 才启动（--profile 是顶层标志，不能写在 up 之后）。
    # 这样「任选数据库」在编排层也成立，SQLite 用户不必被迫配 MySQL 口令、也不起用不到的容器。
    profiles: [mysql]
    image: mysql:8.0
    container_name: weichuan-mysql
    restart: unless-stopped
    environment:
      # 注意：不能用 ${MYSQL_ROOT_PASSWORD:?...}！compose 会对「未被 profile 激活的服务」
      # 也做变量插值，缺省即让默认形态（SQLite 零依赖）的 up 直接失败——那正是要避免的。
      # 故这里用 :- 留空，改由下方 entrypoint 在容器启动时校验，缺口令则打印明确错误并退出
      # （docker compose ps 会看到 mysql 处于 Restarting / Exited，logs 里有提示）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      # 显式声明 root@'%'：官方镜像 entrypoint 的缺省值虽是 %（file_env 'MYSQL_ROOT_HOST' '%'），
      # 但属未文档化的镜像行为；安装向导的 MySQL 形态正是让 backend 容器以 root 走
      # tcp(mysql:3306) 连接，显式写死可防镜像将来改缺省时「装到一半连不上」。
      # （3306 已发布到宿主机，勿再对公网开放；更严的做法是收窄为 backend 所在网段。）
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: weichuan
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
    # 口令校验放在容器内：先检查再交给官方 entrypoint 初始化 mysqld
    # （$$ 是 compose 的转义写法：容器内实际执行时就是 $MYSQL_ROOT_PASSWORD。
    #   注意 docker-compose config 的输出会把 $ 全部显示成 $$——那是为了输出可回喂的
    #   显示层处理，不是没转义；可用 config --no-interpolate 看文件原文对照。）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MYSQL_ROOT_PASSWORD" ]; then
          echo "[微传名片] MYSQL_ROOT_PASSWORD 未设置：cp .env.example .env 后改成强随机值，并用 docker compose --profile mysql up 启动" >&2
          exit 1
        fi
        exec /usr/local/bin/docker-entrypoint.sh mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci \
          --log-bin=/var/lib/mysql/mysql-bin --server-id=1 --binlog-format=ROW \
          --binlog-expire-logs-seconds=604800
    # 上面这三条是 PITR（时间点恢复）的前提，缺了 binlog，「恢复」只能回到最近一次
    # 备份的时刻，之后的数据一概找不回来：
    #   --log-bin             开启二进制日志（默认 8.0 其实是开的，写死防止镜像/配置改缺省）
    #   --server-id           开了 log-bin 就必须有，否则 mysqld 拒绝启动
    #   --binlog-format=ROW   行格式，回放结果与原库一致（STATEMENT 在含非确定性函数时会错）
    #   --binlog-expire-logs-seconds=604800  服务端只留 7 天，磁盘不会被 binlog 撑爆；
    #     它是兜底，正常应由 scripts/backup_binlog.sh 先归档再主动 PURGE。
    # binlog 会带来约 10%~20% 的写放大，确认不需要 PITR 可整段删掉。
    volumes:
      - mysql_data:/var/lib/mysql
      # 首启（mysql_data 为空）时自动执行建表（0001_init → 最新，按序全部应用）。
      # 存量库升级不用管这里：backend 启动时按 schema_migrations 记账表自动补齐
      # 未应用的迁移（AUTO_MIGRATE=0 关闭，改由 `docker exec weichuan-backend \
      # /app/server migrate` 手工跑），详见 docs/deploy-runbook.md §4。
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅本机调试用，故绑回环：写 "3306:3306" 会把数据库直接摊在公网上，
      # 而 mysql 的 root 口令是可被弱口令爆破的（安装向导允许留空以外的任意值，
      # 它只做最小长度校验）。生产建议整行删掉——backend 走 compose 内网即可。
      - "127.0.0.1:3306:3306"
    healthcheck:
      # CMD-SHELL 形式让容器内 shell 展开 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    # docker 的 json-file 驱动默认**不限制**容器日志大小，一个跑一年的服务能把
    # 宿主机磁盘写满（写满之后的表现是「容器随机挂、数据库也起不来」，排查很费劲）。
    # 这里限每文件 10MB、留 7 个（约 70MB 上限）。注意 docker 只在容器**创建**时
    # 读取日志配置：改完要 `docker compose up -d --force-recreate` 才生效。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weichuan-backend
    restart: unless-stopped
    # 不依赖 mysql：安装模式下 backend 根本不连库，连不连得上由安装向导在「装」的那一步决定；
    # MySQL 模式下装完自重启时 mysql 早已 healthy。硬绑 service_healthy 反而会在
    # 纯 SQLite 部署（mysql 不启）时让 backend 永远起不来。
    environment:
      # 留空即进入「首次安装向导」：浏览器打开 8080 会直接进 /setup 安装页，
      # 在页面里填数据库与管理员即可自动建库建表并写回 /app/data/runtime.env。
      # 想跳过向导就在这里（或 .env）显式给 DSN——给了 DSN 就永远不进安装模式。
      DB_DSN: ${DB_DSN:-}
      PORT: "8080"
      # 服务端时区：统计的 stat_date 按服务端本地日期落库（time.Now().Format），
      # 容器默认 UTC 会让「今日」在每天 00:00-08:00（北京时间）落到前一天——
      # 不报错、只是数字悄悄错位。默认北京时间，海外部署在 .env 里覆盖。
      # （运行镜像已装 tzdata，见 backend/Dockerfile；没有它 TZ 会被静默忽略。）
      TZ: ${TZ:-Asia/Shanghai}
      # 不设时由安装向导现场生成随机值（写进配置文件而不是环境变量）；
      # 只有「自己写死配置、不用向导」的部署才需要在 .env 里给。
      JWT_KEY: ${JWT_KEY:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      # 安装向导把配置写到这里（默认 ./data/runtime.env）。必须落在持久卷上，
      # 否则容器重建后配置丢失、又会回到安装页。
      CONFIG_FILE: /app/data/runtime.env
      STORAGE_DRIVER: local
      STORAGE_PUBLIC: "true"
      UPLOAD_DIR: /app/uploads
      # 与下方 nginx 发布端口一致（宿主机访问地址）。
      # 必须留变量壳：这是**对外地址**，生产要换成 https 域名，写死就等于
      # 「.env 里怎么改都不生效」——而 preflight 查的是 .env，会给出虚假 PASS。
      # （也可在后台「系统设置 → 文件存储」覆盖，该项标记为需重启生效。）
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost:8080/uploads}
      WXACODE_TTL_HOURS: "720"
      # gin 的运行模式：不设就是 debug —— 每次启动把**全部路由表**打进日志，
      # 且保留调试期开销。生产固定 release，本地排查可 GIN_MODE=debug 覆盖。
      GIN_MODE: ${GIN_MODE:-release}
      # HTTPS 生产必须：httpOnly Cookie 加 Secure 标志（http 联调保持 false）
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 跨子域共享登录态才设（如前端 admin.xxx.com / 接口 api.xxx.com）
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 可选：=1 开放 /metrics（Prometheus 抓取，建议仅内网可达）
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # 可选：/metrics 的来源网段白名单（逗号分隔 CIDR，如 127.0.0.1/32,10.0.0.0/8）。
      # 留空=不额外限制。这是第二道门：即便上面开关被人在界面上打开，
      # 白名单外的来源（公网）访问 /metrics 仍然一律 404。
      METRICS_ALLOW_CIDR: ${METRICS_ALLOW_CIDR:-}
      # 日志形态：text（默认，人读）/ json（每行一个 JSON 对象，供 Loki / ELK 采集）。
      # 集中日志部署填 json；本地开发保持 text（保留 [WARN] 等既有前缀，grep 好用）。
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # 审计日志保留天数（0=永不自动清理）。也可在后台「系统设置 → 安全」里改，
      # 界面改完即时生效、无需重启；这里是未配置时的回落值。
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      # 可选：WX_APPID / WX_APPSECRET / MINIO_* / OSS_* / CDN_*
    volumes:
      - uploads_data:/app/uploads
      # 安装向导写出的配置（runtime.env）与 SQLite 库文件都在这里，必须持久化
      - data_data:/app/data
    expose:
      - "8080"
    ports:
      # 后端直连调试端口（绕过 nginx）。**必须绑回环**，不能写 "8090:8080"：
      # docker 的端口映射会把所有外部来源 NAT 成桥接网关地址（172.x.0.1），
      # 而网关落在后端的「可信反代网段」里 —— 于是任何能访问这个端口的人
      # 自带一个伪造的 X-Forwarded-For 就能绕过登录限流（实测有效）。
      # 绑 127.0.0.1 后该端口只有本机能连，外部再也伪造不了。
      # 生产环境若不需要直连调试，把这两行整个删掉更干净。
      - "127.0.0.1:8090:8080"
    healthcheck:
      # 依赖 /healthz/ready（就绪探针，查 DB；见 handler.New）。
      # 不用 /healthz/live：live 只确认进程活着，DB 断开时仍返回 200，
      # 编排会以为容器健康而继续把流量打给它。容器健康检查要看的是「能不能干活」。
      # 但「未配置模式」要例外：安装向导页期间 ready 如实返回 503（业务确实不可用），
      # 可进程是健康的——若也判 unhealthy，编排会反复重启、装到一半被打断。
      # 故 503 时再确认一次 /api/setup/status 是否 configured=false，是则按健康放行；
      # 已配置却 503（数据库连不上）仍然判失败，这也是监控要看的信号。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz/ready >/dev/null 2>&1 && exit 0; wget -q -O - http://127.0.0.1:8080/api/setup/status | grep -q 'configured\":false'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weichuan-frontend
    restart: unless-stopped
    # 只等 backend 容器起来（nginx 需要能解析 upstream 主机名），不等 healthy：
    # 首次部署时 backend 处于安装模式、/healthz 报 503，等 healthy 会永远等不到，
    # 而这一版的安装页正是由本前端提供的——前端起不来就等于装不了。
    depends_on:
      - backend
    ports:
      - "8080:80" # PC 管理后台入口；nginx 反代 /api 与 /uploads 到 backend:8080
    # 官方 nginx 镜像把 access.log / error.log 软链到了 stdout，因此这里的轮转
    # 同时管住 nginx 访问日志（不设的话它会一路涨到撑爆磁盘）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  # HTTPS 终结（Caddy 自动申请 + 续期 Let's Encrypt 证书）。
  # 默认不启（零依赖形态只暴露 8080 http）；生产用：
  #   docker compose --profile https up -d --build
  # 启了之后对外只走 80/443（Caddy），8080 仍可作为绕过反代的后端直连调试端口。
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  mysql_data: # 仅 --profile mysql 时创建
  uploads_data:
  # 后端配置（runtime.env）与可选 SQLite 库文件；删掉它会回到「未配置」状态
  data_data:
  caddy_data: # 仅 --profile https 时创建：Caddy 证书与账户数据，删掉会重新申请证书
