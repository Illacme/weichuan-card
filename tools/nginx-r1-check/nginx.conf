# R1 验证装置 · 容器主配置
#
# 结构：http{} 里放 4 个桩上游（模拟「平台 Go 服务」和 3 个租户桶）+ 1 个 TLS 桩桶，
# 然后 include site.conf（手写站-点壳，内含生成物 snippets/*.conf）与 probes.conf
# （手写对照探针）。生成器在 backend/cmd/nginx-snippets，只产出 location 段。
#
# 桩为什么可信：nginx 自己作为上游时，静态文件同样走 sendfile + Range 分片，
# 200/206/304/404 与 ETag/Last-Modified/Accept-Ranges 都会真实产生，
# 所以「Range 透传、状态码分流、头叠加」这三类断言测的是真行为，不是假想。
worker_processes 1;
error_log /cfg/logs/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /cfg/logs/access.log;
    client_body_temp_path /tmp/cbt;
    proxy_temp_path       /tmp/pt;
    fastcgi_temp_path     /tmp/ft;
    uwsgi_temp_path       /tmp/ut;
    scgi_temp_path        /tmp/st;
    server_tokens off;

    # ===== 桩上游 1：平台 Go 服务 =====
    # 对应现状：线上 /uploads/ 反代到 127.0.0.1:8080，Go 侧 r.Static("/uploads", UploadDir) 出盘。
    # 这里用 nginx 静态文件复刻同形态（URI 不重写、支持 Range），并打 X-Stub 头，
    # 让「这条请求到底走了桶还是走了平台盘」可以被断言，而不是靠肉眼看日志。
    server {
        listen 127.0.0.1:8080;
        access_log off;
        location ^~ /uploads/ {
            root /cfg/www/go-uploads;
            add_header X-Stub "go-platform" always;
        }
        location / {
            default_type text/plain;
            add_header X-Stub "go-platform" always;
            return 200 "go-platform";
        }
    }

    # ===== 桩上游 2/3：两个租户桶（明文）=====
    # 关键：带 add_header Cache-Control —— 真实桶会把对象元数据里的 Cache-Control 一起回传。
    # 这条头是本装置最重要的被测物之一：它会和站点 add_header 叠加成两条（见 §D 断言）。
    server {
        listen 127.0.0.1:9001;
        access_log off;
        location / {
            root /cfg/www/bucket-a;
            add_header Cache-Control "public, max-age=3600" always;
            add_header Expires "Thu, 01 Jan 2099 00:00:00 GMT" always;
            add_header X-Amz-Request-Id "stub-bucket-a" always;
        }
    }
    server {
        listen 127.0.0.1:9002;
        access_log off;
        location / {
            root /cfg/www/bucket-b;
            add_header Cache-Control "public, max-age=3600" always;
            add_header Expires "Thu, 01 Jan 2099 00:00:00 GMT" always;
            add_header X-Amz-Request-Id "stub-bucket-b" always;
        }
    }

    # ===== 桩上游 4：故障桶（永远 5xx）=====
    # 验证 $uploads_cache 的 5xx 分支在反代场景下是否真的生效（不能缓存故障页）。
    server {
        listen 127.0.0.1:9003;
        access_log off;
        location / {
            default_type text/html;
            return 500;
        }
    }

    # ===== 桩上游 5：TLS 桶（校验 Host/SNI）=====
    # 真实 OSS/S3/MinIO 在 Host 与桶名不匹配、或没带 SNI 时都会拒（421 Misdirected Request /
    # 签名错误的 403）。这里用「$ssl_server_name 为空 → 421」复现这一类拒绝，
    # 从而证明 proxy_ssl_server_name / proxy_ssl_name 是必需项，不是可选优化。
    server {
        listen 9443 ssl;
        server_name bucket-a.test;
        access_log off;
        ssl_certificate     /cfg/cert/bucket-test.pem;
        ssl_certificate_key /cfg/cert/bucket-test.key;
        if ($ssl_server_name = "") {
            return 421;
        }
        location / {
            root /cfg/www/bucket-a;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Amz-Request-Id "stub-bucket-tls" always;
        }
    }

    # 站点壳（手写、入库）：map + server{} + /uploads/ 回退段 + include 生成物
    include /cfg/site.conf;
    # 对照探针必须排在 site.conf 之后：它要用 site.conf 里定义的 $uploads_cache。
    include /cfg/probes.conf;
}
