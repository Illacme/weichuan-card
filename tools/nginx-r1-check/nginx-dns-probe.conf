# R1 验证装置 · 「桶域名解析不出来」时 nginx -t 会怎样
#
# 这不是产品配置，是一条**失败预期**的探针：`proxy_pass` 里写的是字面主机名，
# nginx 在加载配置时就解析它。所以只要某家租户把桶域名填错（或 DNS 还没生效），
# `nginx -t` 直接 emerg —— 而宝塔「保存并 reload」的顺序是 test 失败就不 reload，
# 结果是**整站配置更新被卡住**：既包括这次的新租户，也包括同一文件里的其它所有改动。
#
# 结论会写进可行性文档 §4 R1-c：snippet 生成器必须**先做 DNS 预检**，
# 不能把「域名可解析」这件事交给 nginx 去发现。
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/dns-probe.pid;

events { worker_connections 16; }

http {
    server {
        listen 8099;
        location ^~ /uploads/t/99/ {
            # .invalid 是 RFC 2606 保留 TLD，保证永远解析不出来
            proxy_pass https://wc-t99.bucket-does-not-exist.invalid;
            rewrite ^/uploads/(.*)$ /$1 break;
        }
    }
}
