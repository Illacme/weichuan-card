# R1 验证装置 · 对照探针（**非产品形态**）
#
# 这些 location 不会出现在线上配置里。它们存在的唯一目的是把「某条指令是必需的」
# 从断言变成证据：每一项都只比产品形态**差一行**，差的那一行就是要证明的东西。
#
# 单独一个 server（8091），避免和产品段的前缀撞车；头指令复刻产品段的完整写法，
# 保证被比较的只有那一行差异。
server {
    listen 8091;
    server_name r1-probe.test;

    # ============ P1 · Option A：把租户前缀写进 proxy_pass 的 URI 部分 ============
    # 期望：200（说明这条路也能通）。但它要求 nginx 也知道 `t/<cid>/` 布局，
    # 键布局一改就要同步改 Go + 每一条 snippet → 不采用，只作为「另一种写法也可行」的记录。
    location ^~ /probe/opt-a/ {
        proxy_pass http://127.0.0.1:9001/t/5/;
        proxy_set_header Host "127.0.0.1:9001";
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $uploads_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ============ P2 · 不藏桶自带的 Cache-Control ============
    # 期望：响应里出现**两条** Cache-Control（桶的 max-age=3600 + 站点的 immutable）。
    # 这条断言"故意失败"是有意义的：它证明 proxy_hide_header 不是可选优化。
    location ^~ /probe/no-hide/ {
        proxy_pass http://127.0.0.1:9001;
        rewrite ^/probe/no-hide/(.*)$ /t/5/$1 break;
        proxy_set_header Host "127.0.0.1:9001";
        proxy_http_version 1.1;
        # 刻意不写 proxy_hide_header
        add_header Cache-Control $uploads_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ============ P3 · HTTPS 桶但不带 SNI ============
    # 期望：421（桩桶在 $ssl_server_name 为空时拒绝，复刻真桶的 Host/SNI 校验）。
    # 注意：即使有 proxy_ssl_verify + 可信 CA + proxy_ssl_name，
    # 少了 proxy_ssl_server_name on 仍然可能被拒 —— 这条就是为它设的。
    location ^~ /probe/no-sni/ {
        proxy_pass https://127.0.0.1:9443;
        rewrite ^/probe/no-sni/(.*)$ /t/5/$1 break;
        proxy_set_header Host "bucket-a.test";
        proxy_http_version 1.1;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /cfg/cert/bucket-test.pem;
        proxy_ssl_name "bucket-a.test";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $uploads_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # ============ P4 · HTTPS 桶 + SNI + 证书校验 ============
    # 期望：200。与 P3 的唯一差异是 proxy_ssl_server_name on。
    location ^~ /probe/sni/ {
        proxy_pass https://127.0.0.1:9443;
        rewrite ^/probe/sni/(.*)$ /t/5/$1 break;
        proxy_set_header Host "bucket-a.test";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name "bucket-a.test";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /cfg/cert/bucket-test.pem;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $uploads_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
