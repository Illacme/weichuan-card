# R1 验证装置 · 站点壳（**手写、入库、不由生成器产出**）
#
# 这里只放「生产上已经存在、且不属于生成器职责」的部分：
#   - http 级的 $uploads_cache map（线上 nginx-site.live.conf:68-79 已有，逐字对齐）
#   - server{} 壳 + server 级安全头
#   - /uploads/ 回退段（线上现状：proxy_pass 到 Go，由 r.Static 出盘）
#
# 租户分支**不在**这里，而是 `include snippets/*.conf` —— 那个文件由
# `backend/cmd/nginx-snippets` 生成。故意这么切，是因为生产上也要走同一条路径：
# 在 nginx-site.live.conf 的 server{} 里加一行 include，再由生成器往目录里写文件，
# 而不是让人去改那份「整体替换用」的配置。本装置因此连 include 机制本身一起验了。
#
# 为什么 map 在 http 级：它是 http 级指令，塞进 server{} 里 nginx -t 直接报
# "directive is not allowed here"。这也是生成器只输出 location 段的原因 ——
# 它产出的东西要被 include 进 server{}，里面不能有 map。
map $status $uploads_cache {
    200      "public, max-age=31536000, immutable";
    206      "public, max-age=31536000, immutable";
    304      "public, max-age=31536000, immutable";
    404      "no-store";
    410      "no-store";
    500      "no-store";
    502      "no-store";
    503      "no-store";
    504      "no-store";
    default  "no-cache";
}

server {
    listen 8090;
    server_name r1.test;

    # 安全响应头（server 级）：覆盖回退段等没有自己 add_header 的路径。
    # 注意 location 里只要出现一个 add_header，server 级这一组就整组失效——
    # 所以生成器在每段 location 里都重复声明了同一组。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # === 生成物：每租户一段 location ^~ /uploads/t/<cid>/ ===
    include /cfg/snippets/*.conf;

    # === 回退段：逐字复刻线上 nginx-site.live.conf:447-459（只把 upstream 指向桩 Go）===
    # 没有租户配置的 /uploads/... 一律走平台盘：存量老图、素材库、小程序码、
    # 以及未接入租户的新上传。这一段保证「关掉某个租户的存储配置」等于
    # 「立刻回到平台默认」，而不是 404。
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control $uploads_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
