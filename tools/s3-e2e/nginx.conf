# 真桶端到端装置 · 容器主配置（第六十三轮）
#
# 与 tools/nginx-r1-check 的区别只有一处，但它是本质的一处：
# R1 的上游是 nginx 自己扮演的「桶」（静态目录），这里的上游是一个**真的 S3 服务端**
# （versitygw，POSIX 后端）。所以这里能验的是 R1 验不了的那半：
# 「Go 写的对象键，在真桶里到底存不存在、取回来是不是同一份字节」。
#
# 本文件不含任何 location：租户段全部来自 cmd/nginx-snippets 的生成物
# （snippets/00-tenants.conf）。手写一条就等于绕过被测物。
worker_processes 1;
error_log /cfg/logs/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /cfg/logs/access.log;
    client_body_temp_path /tmp/cbt;
    proxy_temp_path       /tmp/pt;
    fastcgi_temp_path     /tmp/ft;
    uwsgi_temp_path       /tmp/ut;
    scgi_temp_path        /tmp/st;
    server_tokens off;

    # snippet 里每条 location 都用 $uploads_cache。生产上它由 http 级 map 提供
    # （见 deploy/nginx 的站点配置）；这里按同样的位置补上，否则 nginx -t 直接
    # 报 unknown variable——这个装置要跑的是 snippet 原文，不能为了跑通去改它。
    map $sent_http_content_type $uploads_cache {
        default "public, max-age=3600";
    }

    server {
        listen 18080;
        server_name _;

        # 生成物：每条 location ^~ /uploads/t/<cid>/ 都指向该租户自己的桶。
        include /cfg/snippets/00-tenants.conf;

        # 平台回退段。生产上这里反代到 Go 的 r.Static("/uploads", UploadDir)。
        # 本装置里平台盘不在容器内，于是用「404 + X-Stub 标记」表达同一件事：
        # 这个请求没有交给任何租户桶。断言只需要能区分「走了桶」与「回落了平台」。
        location ^~ /uploads/ {
            add_header X-Stub "platform-fallback" always;
            return 404;
        }

        location / {
            return 204;
        }
    }
}
