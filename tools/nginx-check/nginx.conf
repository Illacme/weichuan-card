worker_processes 1;
error_log /cfg/logs/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /cfg/logs/access.log;
    client_body_temp_path /tmp/cbt;
    proxy_temp_path       /tmp/pt;
    fastcgi_temp_path     /tmp/ft;
    uwsgi_temp_path       /tmp/ut;
    scgi_temp_path        /tmp/st;
    server_tokens off;

# ===== 桩后端：模拟 Go 服务，把收到的头原样回显，用来验证反代是否改写了 IP =====
server {
    listen 127.0.0.1:8080;
    access_log off;
    # /uploads/missing 前缀模拟「文件不存在」的 404——验证 /uploads/ 的缓存头按
    # 状态码分流（404 必须 no-store，绝不能跟 200 一样带 immutable 被 CF 锁死一年）。
    # 注意反代不改写路径，后端收到的是完整 URI（含 /uploads/），前缀要带全。
    location /uploads/missing {
        default_type application/json;
        return 404 '{"stub":"backend","error":"not found","uri":"$request_uri"}';
    }
    # 公开只读接口：模拟 Go 后端自己发的 Cache-Control（handler 里的 cdnCache(c, 60)）。
    # 用来验证 /api/ 反代既**不吞**也**不重复**上游这个头——两种都会让边缘缓存静默失效：
    # 被吞了 → CF 读不到 TTL，cf-cache-status 一直 DYNAMIC；
    # 重复了 → 同一个头带两个值，CDN 取哪个不确定（RFC 9111 不保证）。
    location = /api/card {
        default_type application/json;
        add_header Cache-Control "public, max-age=60, s-maxage=60";
        return 200 '{"stub":"backend","uri":"$request_uri"}';
    }
    location / {
        default_type application/json;
        return 200 '{"stub":"backend","uri":"$request_uri","remote_addr":"$remote_addr","xri":"$http_x_real_ip","xff":"$http_x_forwarded_for","host":"$host","xfh":"$http_x_forwarded_host","proto":"$http_x_forwarded_proto"}';
    }
}

    include /cfg/conf.d/*.conf;
}
