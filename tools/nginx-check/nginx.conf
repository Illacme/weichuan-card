worker_processes 1;
error_log /cfg/logs/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /cfg/logs/access.log;
    client_body_temp_path /tmp/cbt;
    proxy_temp_path       /tmp/pt;
    fastcgi_temp_path     /tmp/ft;
    uwsgi_temp_path       /tmp/ut;
    scgi_temp_path        /tmp/st;
    server_tokens off;

    # ===== 桩后端：模拟 Go 服务，把收到的头原样回显，用来验证反代是否改写了 IP =====
    server {
        listen 127.0.0.1:8080;
        access_log off;
        location / {
            default_type application/json;
            return 200 '{"stub":"backend","uri":"$request_uri","remote_addr":"$remote_addr","xri":"$http_x_real_ip","xff":"$http_x_forwarded_for","host":"$host","xfh":"$http_x_forwarded_host","proto":"$http_x_forwarded_proto"}';
        }
    }

    include /cfg/conf.d/*.conf;
}
