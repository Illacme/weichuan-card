openapi: 3.0.3

# 微传名片 · 后端 API 规范
# 单一事实来源：路由见 backend/internal/handler/*.go，本文档与之保持同步。
# 本地预览：VS Code 装 "OpenAPI (Swagger) Editor" 插件，或粘贴到 https://editor.swagger.io
# 字段级映射（三端联调）另见《微传名片V1.3_三端联调与接口总表.md》。

info:
  title: 微传名片 API
  version: "1.3.0"
  description: |
    电子名片小程序 + PC 管理后台的后端接口。

    ## 通用约定
    - 响应体统一为 `{ "code": number, "msg"?: string, ... }`：
      `code=0` 成功；`code=1` 业务失败（参数错误 / 密码错误 / 资源不存在）；
      `code=2` 特殊状态（名片已停用 / 账号已停用）。
    - **鉴权失败返回的是 HTTP 200 + `{code:401}` / `{code:403}`**（历史约定，前端以 body.code 判断），
      不是 HTTP 状态码；HTTP 4xx/5xx 仅用于网关 / 框架层错误。
    - 登录限流超限返回 `{code:429}`（按客户端 IP 固定窗口）。

    ## 分页约定（管理端列表）
    - 管理端「会随时间增长」的列表（员工 / 企业 / 申请 / 平台账号 / 审计日志）一律服务端分页：
      请求 `?page=&size=`（size 缺省 20、上限 100），响应 `{ code:0, data:[...当前页...], total, page, size }`——
      **data 仍是数组**，总数与页码在顶层。越界页码由后端夹到末页并回传夹后的 page。
    - 关键字段筛选（keyword / status）同样在服务端完成：前端只筛当前页会出现
      「搜得到但翻页后又没了」的错觉。

    ## 多租户作用域（`?companyId=`）
    - 后台有两级身份：平台超管（`admins.company_id=0`）可见全部企业，企业管理员只见本企业。
    - 企业内容 / 数据统计 / 审核管理 / 员工管理这些接口都接受 `?companyId=` **收窄到某一家企业**，
      参数定义见 `components.parameters.CompanyScope`。
    - **企业管理员传了也无效**：后端一律按令牌里的 `company_id` 过滤，越权读改别家会被挡下。
    - 前端不逐接口传：`api/request.ts` 的请求拦截器给 `/admin/**` 统一补上，值来自顶栏企业选择器。
      平台超管**未选企业**时界面直接拦成空态，不放请求——因此这两种历史缺省行为（统计类「全部企业」、
      内容类「回落 1 号企业」）在界面上不会出现。

    ## 两种鉴权方式
    - **小程序端（Bearer）**：`Authorization: Bearer <access token>`，token 由 JS 显式携带。
    - **PC 管理后台（httpOnly Cookie）**：登录后服务端下发 `access_token` / `refresh_token`
      Cookie（`HttpOnly; SameSite=Lax`），浏览器自动携带，JS 不可读。
    - access 15 分钟 / refresh 30 天；`POST /api/refresh` 静默续期；
      改密 / 禁用即时吊销（账号级 token_version），登出精确吊销当前设备（会话级 sid 黑名单）。

servers:
  - url: http://127.0.0.1:8080
    description: 本地开发（devserver / docker compose）

tags:
  - name: 系统
    description: 健康检查与指标
  - name: 公开内容
    description: 小程序首页 / 名片 / 业绩 / 服务（无需登录）
  - name: 鉴权
    description: 登录 / 刷新 / 登出
  - name: 员工端
    description: 小程序员工自服务（Bearer 鉴权）
  - name: 超管-申请审核
    description: 开通申请 / 名片修改申请审核
  - name: 超管-员工管理
    description: 员工增删改查 / 停启用 / 重置密码
  - name: 超管-内容管理
    description: 企业信息 / 分类 / 项目 / 服务 / 首页布局
  - name: 存储
    description: 上传 / 预签名 / 私有签名 / CDN 刷新 / 小程序码
  - name: 可观测性
    description: 请求追踪 / 前端报错回传 / 日志关联
  - name: 授权
    description: 授权状态与到期提醒（席位 / 到期日 / 临期清单）

paths:
  # ───────────────────────── 系统 ─────────────────────────
  /healthz:
    get:
      tags: [系统]
      summary: 健康检查索引页（恒 200，不做健康判断）
      description: |
        **纯索引页**，列出可用的探针端点，**不做任何健康判断、恒返回 200**。

        ⚠️ 这不是探针，**不要拿它做告警**——数据库挂了它照样 200，监控会静默失效。
        存活看 `/healthz/live`，就绪看 `/healthz/ready`，告警与编排一律打这两个。

        保留根路径不是为了向后兼容（产品尚未商用发布，无历史包袱），是两个实际用途：

        1. **发现**：人手 `curl` 或运维排障时先打根路径，一眼看到该用哪个子端点，
           不必翻文档；
        2. **兜底**：Nginx 对「以 `/` 结尾的 location」有内建 `auto_redirect`，会把
           `/healthz` 301 到 `/healthz/`。这里必须有个返回 200 的处理器接住，否则
           后端按 `RedirectTrailingSlash` 再 301 回 `/healthz`，两边互踢成死循环
           （线上真实报过 `ERR_TOO_MANY_REDIRECTS`）。

        带尾斜杠的 `/healthz/` 注册同一处理器，原因即上述第 2 点。
      responses:
        "200":
          description: 索引页（无论数据库是否可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  configured:
                    type: boolean
                    description: 是否已完成安装配置；安装模式下为 false，但状态码仍是 200
                    example: true
                  endpoints:
                    type: object
                    description: 可用探针端点
                    properties:
                      live:
                        type: string
                        example: /healthz/live
                      ready:
                        type: string
                        example: /healthz/ready

  /healthz/live:
    get:
      tags: [系统]
      summary: 存活探针（只确认进程活着，不查任何依赖）
      description: |
        进程能响应 HTTP 即返回 200，**不查数据库、不查磁盘、不查任何外部依赖**。

        与 `/healthz/ready` 的分工：liveness 失败意味着「进程该被重启」，
        readiness 失败只意味着「暂时别给它流量」。DB 故障时重启进程毫无帮助，
        只会形成重启风暴——K8s 官方文档明确要求 liveness 不检查外部依赖。

        因此本端点也**不能**用于告警：DB 断开时它照样 200。
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /healthz/ready:
    get:
      tags: [系统]
      summary: 就绪探针（探活数据库）
      description: |
        `SELECT 1` 探活数据库：正常 `200 {status:"ok",db:"up"}`；
        DB 不可达 `503 {status:"degraded",db:"down",error:"..."}`；
        首次部署尚未配置（`DB_DSN` 未提供）时 `503 {status:"unconfigured",db:"unknown"}`。

        **监控与编排应使用本端点**：docker-compose 的 backend healthcheck、
        `scripts/alert_check.sh` 的 R1/R4、`scripts/preflight.sh` 的外部可达性都探它。
        用 `/healthz/live` 做告警会漏掉「进程在但 DB 连不上」这一整类故障。
        注意「未配置」也是一种不可用，必须如实 503——容器编排另按
        `/api/setup/status` 的 `configured=false` 把安装阶段视为"进程健康"。
      responses:
        "200":
          description: 服务就绪（DB 可达）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: up
        "503":
          description: 未就绪（DB 不可达 / 尚未完成安装）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  db:
                    type: string
                    example: down
                  error:
                    type: string

  /metrics:
    get:
      tags: [系统]
      summary: Prometheus 指标（默认关闭，METRICS_ENABLED=1 开启）
      description: 文本格式指标：请求计数（按方法 × 状态类）与进程 uptime。生产建议仅内网可达。
      responses:
        "200":
          description: Prometheus text/plain
          content:
            text/plain:
              schema:
                type: string

  /api/setup/status:
    get:
      tags: [系统]
      summary: 首次安装状态（安装向导用，无需鉴权）
      description: |
        `configured` 一律以 `DB_DSN` 为准（环境变量与配置文件两层都查）。
        未配置时附带 `installable=true`、可复制的 `envText` 与 `mysqlHint`
        （编排环境预填值，**不含口令**）。前端在挂载前调用一次：
        未配置 → 渲染安装向导（旧后端没有安装接口则退回只读引导）；失败 → 按"已配置"处理。
      responses:
        "200":
          description: 安装状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      installable:
                        type: boolean
                      configFile:
                        type: string
                        example: ./data/runtime.env
                      adminUser:
                        type: string
                        example: admin
                      sqlitePath:
                        type: string
                        example: ./data/weichuan.db
                      envText:
                        type: string
                      missing:
                        type: array
                        items:
                          type: object
                          properties:
                            env:
                              type: string
                            why:
                              type: string
                            value:
                              type: string

  /api/setup/test:
    post:
      tags: [系统]
      summary: 测试数据库连接（不建库、不建表、不写任何东西）
      description: |
        仅在"未配置模式"下挂载（正常模式返回 404，结构上不可重放）。
        带同源检查：Origin/Referer 的宿主必须与 Host 一致，挡 CSRF 与 DNS rebinding；
        两个头都缺失（curl / 脚本）放行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallReq"
      responses:
        "200":
          description: 连通（code=0，data 含掩码 DSN）或失败（code=1，msg 为可读原因）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      driver:
                        type: string
                        example: mysql
                      dsn:
                        type: string
                        description: 掩码后的连接串（口令显示为 ******）
                      willCreate:
                        type: boolean
                      note:
                        type: string

  /api/setup/install:
    post:
      tags: [系统]
      summary: 执行安装（建库建表 + seed 超管 + 写配置文件 + 自重启）
      description: |
        同样的未配置模式门禁与同源检查，另外还有两道硬条件：
        (1) 进程内一次性锁，装过一次即拒绝；(2) 目标库 `admins` 表已有数据即拒绝，
        绝不接管在用系统。配置写入 `CONFIG_FILE`（0600、临时文件 + rename 原子写），
        最后由页面轮询 `/api/setup/status` 感知 `configured=true` 后跳登录页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInstallReq"
      responses:
        "200":
          description: 安装成功（code=0）或失败（code=1）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      driver:
                        type: string
                      dsn:
                        type: string
                      configFile:
                        type: string
                      restarted:
                        type: boolean
                        description: 是否已安排自重启（Linux 用 syscall.Exec；Windows 为 false，需人工重启）
                      message:
                        type: string
                      demo:
                        type: object
                        description: |
                          演示数据写入结果，仅在 `loadDemoData=true` 时返回。
                          **口令只在此出现一次**（库里存的是哈希），页面必须让运维当场抄走。
                        properties:
                          companyId:
                            type: integer
                            format: int64
                            description: 演示数据所属企业（恒为 1：小程序公开接口的缺省租户）
                          assetCount:
                            type: integer
                            description: 落盘的内嵌素材数量（27 个占位图）
                          accounts:
                            type: array
                            items:
                              type: object
                              properties:
                                where:
                                  type: string
                                  description: 登录入口（PC 后台 / 小程序）
                                user:
                                  type: string
                                pass:
                                  type: string
                                  description: 本次随机生成的口令；账号已存在时不会出现该条目
                                role:
                                  type: string
                      warnings:
                        type: array
                        description: |
                          不影响安装成功、但运维需要知道的偏差（演示数据写不全、存储驱动非 local
                          导致演示素材未落盘等）。刻意不升级为 code=1：此时库与管理员已就绪，
                          报错重试会被「新鲜库守卫」挡住，把运维卡死在半路。
                        items:
                          type: string

  # ───────────────────────── 公开内容 ─────────────────────────
  /api/card:
    get:
      tags: [公开内容]
      summary: 聚合名片（员工 + 企业信息 + 公司简介）
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: |
            code=0 成功；code=1 员工不存在；code=2 名片已停用（无数据）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  employee:
                    $ref: "#/components/schemas/Employee"
                  company:
                    $ref: "#/components/schemas/CompanyInfo"
                  profile:
                    $ref: "#/components/schemas/CompanyProfile"

  /api/achievements:
    get:
      tags: [公开内容]
      summary: 经典业绩（分类 + 首页精选项目）
      description: >-
        featured 为首页精选，最多 20 条（首页只画得下这些）；只返回 id / categoryId /
        name / summary / cover，不含 detail 富文本。分类列表不受此上限约束。
        响应带 Cache-Control: public, max-age=60。
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/AchievementCategory"
                  featured:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects:
    get:
      tags: [公开内容]
      summary: 项目案例列表（按分类；列表字段，不含富文本正文）
      description: >-
        一次全量展示（端上无分页 UI）。条数上限 200，可用 limit 调小；超上限一律夹到 200。
        列表只返回 id / categoryId / name / summary / cover / categoryName——detail 富文本
        与 album 图集不随列表下发，详情请取 /api/projects/{id}。响应带 Cache-Control:
        public, max-age=60（给 CDN / 反代用）。
      parameters:
        - name: categoryId
          in: query
          required: false
          description: 分类 ID；不传表示全部上架案例
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: 返回条数上限，默认 200、最大 200；非法值或 0 回落默认
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectCase"

  /api/projects/{id}:
    get:
      tags: [公开内容]
      summary: 项目案例详情（album 解析为数组）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在或已下架
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/ProjectDetail"

  /api/services:
    get:
      tags: [公开内容]
      summary: 业务服务列表（列表字段，不含富文本正文）
      description: >-
        条数上限 50，可用 limit 调小。列表只返回 id / title / icon / sort——content 富文本
        不随列表下发，详情请取 /api/services/{id}。响应带 Cache-Control: public, max-age=60。
      parameters:
        - name: limit
          in: query
          required: false
          description: 返回条数上限，默认 50、最大 50
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BizService"

  /api/services/{id}:
    get:
      tags: [公开内容]
      summary: 业务服务详情（content 为富文本，含视频号块）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0 成功；code=1 不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/BizService"

  /api/home-layout:
    get:
      tags: [公开内容]
      summary: 小程序展示配置（板块顺序 + 首页背景 + 风格模板）
      description: |
        字段都在**响应根级**，不在 `data` 里。首页 `loadAll` 一次拿到这四组配置，
        不需要再为详情页时间档位或整体风格多打一次请求。

        P5 起主题是两轴全叉乘：`style`「整体风格」按布局特色命名，决定四个模块的列数 /
        间距 / 圆角 / 封面高度；`brand`「品牌配色预设色板」是纯颜色层，8 款色系在 4 个
        风格上取值逐字一致，可叠加在**任意**风格之上，只覆盖颜色 token 不改版式。
        合法组合 = 4 风格 × (1 个默认色 + 8 款品牌色) = 36 种。两者都走白名单，
        **不是运行时自由色值注入**：小程序代码随版本审核，端上不能动态加载 WXSS，
        这里只下发 id，由端上映射到随包内置的 CSS 变量。
        `styleId` / `brandColorId` 是存储真值（迁移 0043 已删除历史 `template_id`
        兼容派生列，本接口不再下发也不接受 `templateId`）。未开通高级模板授权时
        读路径回落 `default`，但后台保存的两轴值不抹——续费后自动恢复。
        访客从分享链接直达二级页时，`app.ts` 冷启动也会拉本接口预热主题。
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  order:
                    type: array
                    items:
                      type: string
                    example: [achievement, service]
                  bgImage:
                    type: string
                    description: 首页背景图 URL，空串=不设背景
                  bgMask:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: 背景遮罩浓度 0~100
                  styleId:
                    type: string
                    enum: [default, ink, warm, teal]
                    description: 两轴第一轴「整体风格（布局族）」，决定各模块布局；缺省 default（标准均衡）。与 brandColorId 共同作为存储真值。
                  brandColorId:
                    type: string
                    nullable: true
                    enum: [brand-crimson, brand-coral, brand-amber, brand-forest, brand-ocean, brand-indigo, brand-violet, brand-magenta]
                    description: 两轴第二轴「品牌色系（纯颜色层）」；null（缺省）= 用该风格默认色。P5 起可叠加在任意风格之上，8 款色系在 4 风格上取值一致。

  /api/team:
    get:
      tags: [公开内容]
      summary: 名片墙（企业全员）
      description: |
        小程序**裸启动**（扫微信「体验版二维码」/ 直接打开）时的落地页数据源。
        裸启动不会带任何参数，页面拿不到 staffId——此前这种情况会弹一个「输入员工编号」
        的输入框（开发期兜底），访客第一次打开这家公司的小程序就看到一个要数字的弹窗。
        名片墙把落点换成「这家公司有谁」，点谁看谁的名片。

        **只输出白名单字段**（`staffId` / `name` / `title` / `avatar`）：`model.Employee`
        上还挂着 `Phone` / `Phone2` / `Email` / `Landline` / `OpenID`，把结构体直接序列化
        出去等于把全员手机号交给任何扫过码的人。

        只列 `status=enabled` 的员工（停用员工的名片本来就是 `code=2`，挂上去点进去只会看到
        「该员工名片已停用」）。`total` 是启用员工总数，与 `data` 长度不等时说明被上限截断
        （`repository.MaxTeamList`）。
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      responses:
        "200":
          description: code=0 成功；code=1 企业不存在或已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  company:
                    type: object
                    description: 企业抬头（企业信息未填时 fullName/shortName/logo 均为空串，端上回落品牌名）
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: 实际生效的企业 ID（由服务端解析，非回显请求参数）
                      fullName:
                        type: string
                      shortName:
                        type: string
                      logo:
                        type: string
                  entry:
                    type: object
                    description: |
                      该企业配置的「裸启动默认入口」（迁移 0034）。`mode=staff` 时端上会把访客
                      直接改道到该员工的名片，不再渲染名片墙。

                      这里是**生效值**：指定员工被停用或删除时服务端已回落 `wall`，
                      因此不会出现「`mode=staff` 但员工不可用」的组合——管理端看到的是
                      配置原值（另一个接口），两者不一致本身就是要提示给管理员的信息。

                      本接口**不走 CDN 缓存**：入口设置改完，管理员会立刻扫码验证，
                      缓存 60 秒会被当成「没保存成功」。
                    properties:
                      mode:
                        type: string
                        enum: [wall, staff]
                        description: wall=名片墙；staff=指定员工的名片
                      staffId:
                        type: integer
                        format: int64
                        description: mode=wall 时为 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        staffId:
                          type: integer
                          format: int64
                        name:
                          type: string
                        title:
                          type: string
                        avatar:
                          type: string
                  total:
                    type: integer
                    description: 该企业启用员工总数（可能大于 data 长度，表示被截断）

  /api/stat/track:
    post:
      tags: [公开内容]
      summary: 埋点上报（转化 + 内容浏览 + 裂变）
      description: |
        事件白名单（权威定义在 `backend/internal/handler/stat.go`）：

        | 事件 | 语义 | targetId |
        |---|---|---|
        | visit | 访问名片 | 0 |
        | call | 点击拨号 | 0 |
        | save | 点击保存 | 0 |
        | project_view | 浏览案例详情 | 案例 ID（强制，须与员工同租户） |
        | service_view | 浏览服务详情 | 服务 ID（强制，须与员工同租户） |
        | video_play | 播放公司视频 | 0 |
        | share | 转发（名片 / 案例 / 服务） | 0 或对象 ID（不强制存在） |
        | poster_save | 海报**成功写入相册**（失败不计） | 0 |

        前三行是「转化」，`project_view`/`service_view`/`video_play` 是「内容浏览」
        （唯一带强制 targetId 的三类，也只有它们进 TOP 榜），`share`/`poster_save`
        是「裂变」（把名片传出去的动作，主体可能是员工本人）。三组在统计侧互不相加。

        公开接口但按 IP 限流 60 次/分（桶键带 `track:` 前缀，与登录限流分桶），
        并校验员工存在、事件类型在白名单内、强制类事件的 targetId 存在且同租户；
        不合法一律 code=1（同一句回包，不泄露别家对象是否存在）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, eventType]
              properties:
                staffId:
                  type: integer
                  format: int64
                eventType:
                  type: string
                  example: project_view
                targetId:
                  type: integer
                  format: int64
                  description: 关联对象 ID；0 或不传 = 无对象
                  example: 12
                source:
                  type: string
                  description: |
                    流量来源（仅统计维度，绝不参与权限 / 租户 / 计费判断）。
                    服务端按白名单归一后落库：空串或纯空白→unknown，白名单原样，
                    其余任意值→other（脏值不污染分布图）。
                    白名单：scan（扫码 / 小程序码，含海报码）、share_card（转发卡片）、
                    search（微信搜索）、poster（扫海报上的码）、unknown、other。
                    小程序端由进入场景 scene 推导（见 miniprogram/utils/track.ts）。
                  enum: [scan, share_card, search, poster, unknown, other]
                  example: share_card
      responses:
        "200":
          description: code=0 成功；code=1 参数错误 / 对象不存在 / 上报失败；code=429 限流

  # ───────────────────────── 鉴权 ─────────────────────────
  /api/employee/login:
    post:
      tags: [鉴权]
      summary: 员工登录（手机号 + 密码，小程序端）
      description: |
        限流：每 IP 每分钟 10 次。成功返回双令牌（响应体），此后走 Bearer 鉴权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 手机号或密码错误（账号不存在与密码错误**刻意不区分**，防账号枚举）；code=2 账号已停用 / 所属企业已停用（仅在密码正确后返回）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: access 令牌
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900

  /api/employee/login/wechat:
    post:
      tags: [鉴权]
      summary: 员工微信一键登录（小程序端）
      description: |
        `wx.login` 的 code → 服务端 jscode2session 换 openid → 找绑定了该 openid 的员工
        → 签发员工令牌。openid 一律由服务端换取，不信任客户端传入的值。

        绑定有两条来源：自助申请开通（审批通过时把申请单里的 openid 写进员工记录）、
        或已用手机号密码登录后调 `/api/employee/wechat/bind`。
        刻意不做「首次微信登录自动建号」——员工账号是审核出来的，自动建号等于
        任何人点一下就变成某企业的员工。

        与密码登录共用 `login:<IP>` 限流桶（默认 10 次/分）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 返回的一次性 code
                companyId:
                  type: integer
                  format: int64
                  description: 客户端所属租户；平台模式下同一 openid 可能对应多家企业，用它收窄
      responses:
        "200":
          description: |
            code=0 成功（token / refreshToken / expiresIn）；
            code=1 缺少 code / 未配置小程序凭据 / 微信侧失败；
            code=2 账号或所属企业已停用（openid 证明不了「你还在这家公司」）；
            code=3 该微信尚未绑定员工账号，或绑定了多个账号（改用手机号密码登录）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer

  /api/employee/wechat/bind:
    post:
      tags: [鉴权]
      summary: 员工绑定 / 换绑微信（已登录）
      description: |
        凭据取员工**自己企业**的小程序 appid，不取客户端传值——绑定是已登录场景，
        身份确定，用错凭据会把别家小程序的 openid 绑进来。

        覆盖写：换微信时重新绑定即可，旧 openid 从此匹配不到任何员工，等同解绑。
        同企业内一个 openid 只能绑一个员工（否则两人会互相登进对方账号）。
        重复绑定同一个微信是幂等的，仍返回 code=0，但不再重复记审计。

        **写库成功后**才记审计 `employee.wx_bind`；Detail 只含 `rebind` 布尔值，
        绝不写 openid / 掩码 / 一次性 code。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: |
            code=0 已绑定；code=1 缺少 code / 未配置凭据 / 未找到员工 /
            该微信已绑本企业其他员工 / 写库失败；code=401 未登录

  /api/wechat/openid:
    post:
      tags: [鉴权]
      summary: 微信身份换取（公开，申请开通时采集 openid）
      description: |
        小程序 `wx.login` 的 code → openid。公开端点（无需登录）：申请人此刻还没有账号。

        凭据按 `companyId` 选：企业独立版用自己的 appid，没配则回落平台全局那一份。
        `companyId` 可以被伪造，但伪造只会让 jscode2session 失败（微信会校验
        appid 与 code 同属一个小程序），拼不出「能用的错凭据」。

        未配置凭据时返回 code=1，前端据此降级为不采集 openid，不影响账号密码登录/申请。
        注意这条回的是**完整 openid 给调用者本人**，用途是写进自己的申请单；
        后台列表只回布尔状态与掩码（见 `Employee` / `PlatformAdmin` schema）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                companyId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: code=0 成功（openid）；code=1 缺少 code / 未配置 AppID 与 WX_APPSECRET / 微信侧失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  openid:
                    type: string
                    description: 仅 code=0 时存在

  /api/admin/login:
    post:
      tags: [鉴权]
      summary: 超管登录（用户名 + 密码，PC 后台）
      description: |
        限流：每 IP 每分钟 10 次。成功**不下发令牌到响应体**，改为 Set-Cookie
        （access_token / refresh_token，HttpOnly; SameSite=Lax）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 用户名或密码错误（账号不存在与密码错误**刻意不区分**，防账号枚举）；code=2 所属企业已停用（仅在密码正确后返回）
          headers:
            Set-Cookie:
              description: access_token / refresh_token（HttpOnly）
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  expiresIn:
                    type: integer
                    example: 900

  /api/admin/login/mobile:
    post:
      tags: [鉴权]
      summary: 管理员登录（小程序端，令牌进响应体）
      description: |
        与 `/api/admin/login` 同一套校验（bcrypt + 空账号烧等价时间 + 企业停用闸门 +
        登录限流 10 次/分），唯一区别是**把 access / refresh 放进响应体**：
        小程序没有 Cookie 容器，PC 的 httpOnly Cookie 流在那边不可用。

        拿到的令牌用 `Authorization: Bearer` 调用 `/api/admin/*`（ExtractToken 优先读头），
        六个 `/api/admin/apply/*` 审核端点因此无需任何改动。刷新走 `/api/refresh` 的 Body 流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: |
            code=0 成功（返回 token / refreshToken / expiresIn / companyId / companyName /
            isPlatform / username / wechatBound）；
            code=1 用户名或密码错误（与 PC 同样不区分「账号不存在」）；
            code=2 所属企业已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: access 令牌（Bearer）
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                  companyId:
                    type: integer
                    format: int64
                    description: 0 = 平台超管
                  isPlatform:
                    type: boolean
                  username:
                    type: string
                  wechatBound:
                    type: boolean
                    description: 该管理员是否已绑定微信（决定能否免密进入）

  /api/admin/login/wechat:
    post:
      tags: [鉴权]
      summary: 管理员微信免密登录（小程序端）
      description: |
        `wx.login` 的 code → 服务端 jscode2session 换 openid → 找绑定了该 openid 的管理员
        → 签发管理员令牌。openid 一律由服务端用小程序凭据换取，不信任入参。

        平台模式下所有租户共用一个 appid，同一微信可能是多家企业的管理员：先用
        `companyId` 收窄，收窄后仍多于一条则返回 code=3，绝不随便挑一个签发令牌
        （登错公司 = 看到别家的待审申请）。限流与密码登录共用（10 次/分）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 返回的一次性 code
                companyId:
                  type: integer
                  format: int64
                  description: 客户端所属租户（独立版固定值 / 平台模式粘滞值）
      responses:
        "200":
          description: |
            code=0 成功（响应体同 `/api/admin/login/mobile`）；
            code=1 缺少 code / 未配置小程序凭据 / 微信侧失败；
            code=2 所属企业已停用；
            code=3 该微信未绑定管理员，或绑定了多个账号（改用账号密码登录）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer

  /api/admin/wechat/bind:
    post:
      tags: [鉴权]
      summary: 管理员绑定 / 换绑微信（免密登录的前提）
      description: |
        已登录后调用。凭据取管理员**自己企业**的小程序 appid，不取客户端传值——
        绑定是已登录场景，身份确定，用错凭据会把别家小程序的 openid 绑进来。

        覆盖写：换微信时重新绑定即可，旧 openid 从此匹配不到任何管理员，等同解绑。
        同企业内一个 openid 只能绑一个管理员（否则两人会互相登进对方账号）。
        动作记审计 `admin.wx_bind`。
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=1 缺少 code / 未配置凭据 / 该微信已绑其他管理员；code=401 未登录

  /api/admin/me:
    get:
      tags: [鉴权]
      summary: 当前登录管理员身份（PC 后台 hydration）
      description: |
        令牌在 httpOnly Cookie 里，JS 读不到 claims，前端靠这条接口还原身份。

        `wechatBound` / `wxOpenidMasked` 让后台能看出**当前账号**绑没绑微信
        （决定小程序端能否免密进审核）。只回布尔状态与掩码，绝不回 openid 原文；
        要看别人的绑定状态，走平台超管列表 / 企业管理员列表。
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功；code=1 未找到账号；code=401 未登录 / 令牌失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      adminId:
                        type: integer
                        format: int64
                      username:
                        type: string
                      companyId:
                        type: integer
                        format: int64
                        description: 0 = 平台超管
                      companyName:
                        type: string
                      companyShortName:
                        type: string
                      isPlatform:
                        type: boolean
                      wechatBound:
                        type: boolean
                        description: 当前账号是否已绑定微信
                      wxOpenidMasked:
                        type: string
                        description: 脱敏后的 openid（首字符 + **** + 后四位）；未绑定为空串
                      independentLock:
                        type: boolean
                        description: 独立版企业锁定：为真时后台企业管理页只读

  /api/refresh:
    post:
      tags: [鉴权]
      summary: 刷新 access 令牌
      description: |
        Cookie 流（PC）：带 refresh_token Cookie，Body 可空，轮换下发新 Cookie。
        Body 流（小程序）：传 `{ "refreshToken": "..." }`，返回新 access。
        限流：每 IP 每分钟 60 次。会话已登出（sid 黑名单）时返回 401。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: code=0 成功；code=401 刷新令牌无效 / 类型错误 / 已失效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  token:
                    type: string
                    description: 新 access（Body 流才有）
                  expiresIn:
                    type: integer

  /api/logout:
    post:
      tags: [鉴权]
      summary: 登出（吊销当前会话 + 清除 Cookie）
      description: |
        单设备精确吊销：从 Bearer / Cookie 解析当前会话 sid 写入黑名单，
        该设备所有令牌立即失效；不影响同一账号其他设备。
        access 过期时退而解析 refresh_token Cookie，仍可收尾会话。
        不挂鉴权中间件（过期后也需能登出）。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
