  /api/wechat/wxacode:
    get:
      tags: [存储]
      summary: 生成员工小程序码（wxacodeunlimit，scene=staffId=N）
      description: >-
        磁盘 / 对象存储缓存；未配置 WX_APPID/WX_APPSECRET 时 code=1。
        本接口公开（访客扫码看名片就要取，因此不挂鉴权），但一次缓存未命中 = 一次真实
        微信接口调用 + 一次对象存储写入，staffId 又是可枚举的整数，故按客户端 IP 限流
        （阈值取系统设置 wxacode_rate_limit_per_min，默认 30 次/分钟，不区分 staffId——
        扫号正是靠换 staffId 放大调用量的），超限返回 code=429。
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: string
            example: pages/index/index
      responses:
        "200":
          description: code=0 成功（data.url 为小程序码图片地址）；code=1 未配置微信凭据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      url:
                        type: string

  # ===== 系统设置（运行参数后台化）=====
  # 配置项分三档：即时生效 / 需重启 / 只读（详见 backend/internal/setting 包注释）。
  # 敏感项（密钥 / 连接串）只回传掩码 "******"，真实值永不出现在响应里。
  /api/public/settings:
    get:
      summary: 公开配置（无需登录）
      description: |
        仅下发非敏感项：brand_name / miniprogram_base_url / pinned_company_id 等。
        小程序冷启动与 PC 登录页取品牌名都走这个接口，因此**不能要求登录**。
        支持查询参数 ?company=<白标码>：精确匹配 enabled 企业的 login_code，
        命中则 data 额外返回 login_brand_name（该企业 short_name），用于登录页按企业区分显示简称；
        未命中（无参数 / 不匹配 / 企业停用）则不返回该键，前端回落全局 brand_name。
        安全口径：只回传 short_name，绝不泄露企业 ID / 名称 / 管理员等其它字段。
      parameters:
        - name: company
          in: query
          required: false
          description: 登录页白标码（?company=）。命中 enabled 企业时回传其简称作为登录品牌名
          schema:
            type: string
      tags: [设置]
      responses:
        "200":
          description: code=0，data 为 key→value 映射
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    additionalProperties:
                      type: string

  /api/admin/settings:
    get:
      summary: 读取全部可配置项（平台超管）
      description: |
        返回 registry 全量项（当前 35 项），每项带生效方式元数据：
        - name：中文名（界面主标签，key 降级为次要灰字）
        - secret：敏感项，value 恒为掩码 "******"（真实值不下发）
        - restart：保存后需重启进程才生效（云存储 / CDN 客户端在启动时构造）
        - readOnly：只读项（db_dsn / jwt_key / cookie_*），PUT 会被拒绝
        - envVar：对应环境变量名（留空时回退它）
        - options：枚举候选值（仅枚举项有，如 storage_driver），界面据此渲染下拉
        - configured：当前是否已有有效值
      tags: [设置]
      responses:
        "200":
          description: code=0，data 为设置项数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettingItem"
    put:
      summary: 批量更新配置（平台超管）
      description: |
        只提交变更项（map[key]value，值统一为字符串）。语义：
        - 非敏感项：提交空串 = 清空并回退同名环境变量
        - 敏感项：留空 = 不修改；提交掩码 "******" 会被拒绝（避免把掩码写成真值）
        - readOnly 项一律拒绝，msg 里提示改用环境变量
        - **值域校验**（类型合法 ≠ 取值合法），非法值直接 code=1 并在 msg 说明原因：
          upload_max_mb 取 1~1024；miniprogram_base_url / upload_base_url 必须 http(s):// 开头；
          storage_driver 只能 local / minio / oss / s3；pinned_company_id 须为 0 或存在且启用的企业 ID
        回包 data.restartKeys 点名「需重启才生效」的项，前端据此提示。
      tags: [设置]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              example: { "brand_name": "朗汇机电", "upload_max_mb": "20" }
      responses:
        "200":
          description: code=0 保存成功；code=1 校验失败（类型非法 / 值域越界 / 未知 key / 只读项 / 掩码值）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      restartKeys:
                        type: array
                        items:
                          type: string

  /api/admin/settings/paths:
    get:
      summary: 浏览服务器目录（平台超管，服务端路径选择器）
      description: |
        让管理员在「后台上传小程序代码」那几项路径配置（Node 可执行文件 / miniprogram-ci
        安装目录 / 小程序源码目录）上，直接在**服务器**文件系统里挑路径，而不是手敲绝对路径——
        也绕开「浏览器文件框选的是客户端机器」这个根本误区（这些路径指向后端要 exec 的服务器）。

        安全口径（见 backend/internal/pathpick 包）：
        - 白名单目录（/opt /srv /usr/local /home /data …，外加服务进程的家目录）才能浏览；
          用黑名单兜底等于玩「你猜我漏了哪个敏感目录」。白名单只收绝对路径（相对路径会随 cwd 漂移）
        - 解析符号链接后再判白名单；列举时遇到软链条目直接跳过（不展示也不跟随）
        - 敏感点目录（.ssh/.aws/.gnupg/.docker/.kube/.config）连名字都不回传
        - 只回目录；仅 node_bin 这一「目标是文件」的类额外回可执行文件
        - 条目数封顶（300），避免巨型目录撑爆响应
        - 已配置的绝对路径（界面优先、空串回落环境变量）会被补进白名单，保证配好的路径一定能继续浏览
        - 自动探测候选只做有界浅扫（深度 ≤ 3、访问目录数 ≤ 2000），且先扫已配置路径再扫家目录

        kind 必须是 node_bin / module_dir / source_dir 之一，否则 code=1。
        响应 data 含：当前目录 path / 父目录 parent / 家目录 home / 子项 entries（带徽标 marker）/
        是否截断 truncated / 当前路径作为该类目标的实时校验 current（ok + message，与后端 CheckPath 同源）/
        自动探测到的候选 suggestions（免去逐层翻目录）。
      tags: [设置]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [node_bin, module_dir, source_dir]
          description: 路径类型，决定「选文件还是目录」与「怎么算对」
        - name: dir
          in: query
          required: false
          schema:
            type: string
          description: 要列举的服务器绝对路径；缺省时按类型给一个合理起点
      responses:
        "200":
          description: |
            code=0 返回目录内容；code=1 业务拒绝（未知 kind / 路径不在白名单 / 目录不存在 / 无起点）。
            前端三处校验（界面提示 / 上传前探活 / 本选择器实时校验）口径与后端 CheckPath 完全一致。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/PathBrowseResult"

