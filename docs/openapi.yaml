  /api/admin/home-layout:
    get:
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      tags: [超管-内容管理]
      summary: 小程序展示配置（首页顺序 + 背景 + 详情页时间档位 + 风格模板）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      order:
                        type: array
                        items:
                          type: string
                      bgImage:
                        type: string
                        description: 首页背景图 URL，空串=不设背景（保持灰底）
                      bgMask:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: 背景遮罩浓度，0=不压暗
                      projectTimeMode:
                        type: string
                        enum: [hidden, date, minute]
                        description: |
                          项目案例详情页「更新于」的档位。从未配置过时回 `date`（缺省），
                          不会回空串（空串会让后台 radio 一个都不选中）。
                      serviceTimeMode:
                        type: string
                        enum: [hidden, date, minute]
                        description: 业务服务详情页的档位，与案例**分开控制**，互不影响。
                      styleId:
                        type: string
                        enum: [default, ink, warm, teal]
                        description: 两轴第一轴「整体风格（布局族）」，按布局特色命名；缺省 default（标准均衡）。
                      brandColorId:
                        type: string
                        nullable: true
                        enum: [brand-crimson, brand-coral, brand-amber, brand-forest, brand-ocean, brand-indigo, brand-violet, brand-magenta]
                        description: 两轴第二轴「品牌色系（纯颜色层）」；null = 用该风格默认色。P5 起 4 风格 × 9 色档 = 36 组合全部合法。
                      templates:
                        type: array
                        description: 后台模板页的可选清单，随二进制内置（端上不硬编码）；按 `series` 分成两轴，后台自行叉乘出 36 个组合。
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            description:
                              type: string
                            series:
                              type: string
                              enum: [style, brand]
                              description: |
                                `style` 整体风格（布局族，按布局特色命名，自带默认色）；
                                `brand` 品牌配色预设色板（纯颜色层，可叠加在任意风格上）。
                                后台按服务端下发的这个字段分两轴，不自行猜 id 前缀。
                            advanced:
                              type: boolean
                              description: 需要 `mp_template_advanced` 授权
                            previewPrimary:
                              type: string
                              description: 后台预览色块主色
                            previewSoft:
                              type: string
                              description: 后台预览色块浅底
                      templateEntitled:
                        type: boolean
                        description: 本租户是否开通高级模板；false 时后台把高级款置灰。
    put:
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      tags: [超管-内容管理]
      summary: 更新小程序展示配置
      description: |
        所有字段都是**可选**：未提供的字段保持原值（服务端用指针区分「未提供」与
        「显式传空」），三个页签各存各的——只提交主题字段不会冲掉板块顺序、
        背景与时间档位。`bgImage` 传空串表示清空背景；`order` 未提供时保持原值，
        新建配置行则落缺省顺序。
        时间档位与主题 id 传枚举外的值一律拒绝（code=1），不做静默兜底。
        **P5 全叉乘**：`styleId` 与 `brandColorId` 可任意组合（4 × 9 = 36 种），
        不再校验「色系属于哪个风格」；只拒绝未知风格 / 未知色系。
        `styleId` / `brandColorId` 是存储真值（迁移 0043 已删除历史 `template_id`
        兼容派生列，本接口不再接受 `templateId`）。
        高级款按租户校验 `mp_template_advanced`：风格与色系**任一为高级**即受约束，
        未开通且属于「新选」时回 code=403；已在用的高级组合带着同值保存其它设置、
        或切回 `default`，都放行（授权降级只禁止新选，不锁死基础展示设置）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: string
                    enum: [achievement, service]
                bgImage:
                  type: string
                bgMask:
                  type: integer
                  minimum: 0
                  maximum: 100
                projectTimeMode:
                  type: string
                  enum: [hidden, date, minute]
                serviceTimeMode:
                  type: string
                  enum: [hidden, date, minute]
                styleId:
                  type: string
                  enum: [default, ink, warm, teal]
                  description: 两轴第一轴「整体风格（布局族）」；缺省 default。仅本字段也能定风格，可与任意色系组合。
                brandColorId:
                  type: string
                  nullable: true
                  enum: [brand-crimson, brand-coral, brand-amber, brand-forest, brand-ocean, brand-indigo, brand-violet, brand-magenta]
                  description: 两轴第二轴「品牌色系（纯颜色层）」；省略或 null = 用该风格默认色。P5 起可叠加在任意风格之上，不再要求「属于所选风格」，否则 code=1 只针对未知 id。
      responses:
        "200":
          description: code=0 成功；code=1 参数错误或枚举取值无效；code=403 未开通高级模板

  /api/admin/mp-entry:
    get:
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      tags: [超管-内容管理]
      summary: 小程序默认入口（配置原值 + 生效值）
      description: |
        裸启动（扫微信「体验版二维码」/ 在微信里直接打开）时访客先看到什么：
        `wall`=企业名片墙，`staff`=指定员工的名片。

        只影响裸启动。员工自己的小程序码（`scene=staffId=`）与转发的名片卡片
        （`?staffId=`）永远进对应员工的名片，与本设置无关。

        同时返回 `mode`（管理员设的）与 `effectiveMode`（访客实际看到的）：
        指定员工被停用/删除时服务端回落 `wall`，两者不一致正是要提示管理员的信号。
        回落**不改配置原值**——员工重新启用后设置自动恢复生效。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: code=0 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/MpEntry"
    put:
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
      tags: [超管-内容管理]
      summary: 设置小程序默认入口
      description: |
        - `mode=wall` 时 `staffId` 忽略并归零（**必须提交 `staffId:0`**，前端切回名片墙时显式传 0）。
        - `mode=staff` 时 `staffId` 必填，且必须是**本企业**的员工；跨租户员工与不存在
          的员工一律 `code=1`（否则能把别家销售挂到自己小程序首页）。
        - 目标员工必须 `status=enabled`：入口指向停用员工，访客点进去只会看到
          「该员工名片已停用」，等于首页直接报废。
        - 非法 `mode` 直接拒绝，不做静默兜底（静默兜底会让前端写错值时表现为「保存成功但没变」）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [wall, staff]
                staffId:
                  type: integer
                  format: int64
                  description: mode=staff 时必填；mode=wall 时传 0
      responses:
        "200":
          description: code=0 成功；code=1 参数错误 / 员工不属于本企业 / 员工已停用

