  /api/admin/stats/detail:
    get:
      tags: [超管-员工管理]
      summary: 埋点明细（汇总的下钻）
      description: |
        逐条事件，按 id 倒序分页 `{code:0,data,total,page,size}`。
        与 /api/admin/stats 同租户隔离、同日期口径——两边口径必须一致，
        否则「汇总 100、明细 105」是最难排查的事故。
        `targetId` 配 `eventType=project_view|service_view` 用于从 TOP 榜下钻。
        不在白名单内的 eventType 与坏参数一律 code:1（不静默忽略）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: staffId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          description: 事件白名单之一；白名单外 code:1
          schema:
            type: string
            example: project_view
        - name: targetId
          in: query
          required: false
          description: 内容对象 ID（配 eventType 下钻 TOP 榜）
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: 缺省 1；越界由后端夹到末页并回传夹后的 page
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: 缺省 20，上限 100
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功；code=1 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatDetailItem"
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer

