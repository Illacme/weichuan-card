          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                shortName:
                  type: string
      responses:
        "200":
          description: code=0；code=1 未找到

