                        example: oss
                      presign:
                        type: boolean
                      videoUpload:
                        type: boolean
                        description: 视频上传档是否可用（driver 非 local 且 presign）
                      videoMaxMb:
                        type: integer
                        description: >-
                          视频上传上限，来自系统设置 upload_video_max_mb。前端据此在选文件时预校验，
                          并在提示里显示同一个数字；直传失败回退成 multipart 时服务端也按这个值把关
                          （在此之前服务端只认图片的 upload_max_mb，导致「界面说 100MB、实际按 10MB 拒」）。
                      reason:
                        type: string
                        description: 不可用时给用户的中文原因，可用时为空串

