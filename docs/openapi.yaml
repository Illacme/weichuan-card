        返回的是 `text/csv` 而非 JSON 信封：带 UTF-8 BOM（Excel 双击不乱码），
        单元格以 `'` 前缀防公式注入。**PII 是明文导出**，属高风险动作，记审计
        `employee.export_batch`；前端需用 fetch（带 credentials）而非 axios 拦截器取。
      security:
        - cookieAuth: []
