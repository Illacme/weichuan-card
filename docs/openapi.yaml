                  data:
                    type: object
                    properties:
                      driver:
                        type: string
                        example: oss
                      presign:
                        type: boolean
                      videoUpload:
                        type: boolean
                        description: 视频上传档是否可用（driver 非 local 且 presign）
                      videoMaxMb:
                        type: integer
                        description: 视频上传上限，来自系统设置 upload_video_max_mb
                      reason:
                        type: string
                        description: 不可用时给用户的中文原因，可用时为空串

  /api/employee/upload/presign:
    get:
      tags: [存储]
      summary: 直传预签名 PUT URL（员工端）
      security:
        - bearerAuth: []
      parameters:
        - name: ext
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 同 /api/admin/upload/presign

  /api/admin/storage/sign:
    post:
      tags: [存储]
      summary: 私有桶限时签名（按 URL 反推 key）
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: code=0 成功；code=1 驱动不支持 / CDN 未配置或厂商凭据不全
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      signed:
                        type: object
                        additionalProperties:
                          type: string

  /api/employee/storage/sign:
    post:
      tags: [存储]
      summary: 私有桶限时签名（员工端）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 同 /api/admin/storage/sign

  /api/admin/cdn/refresh:
    post:
      tags: [存储]
      summary: 触发 CDN 缓存刷新
      description: >-
        按当前配置的 CDN 厂商提交刷新：阿里云 / 腾讯云 / 七牛云 / Cloudflare / AWS CloudFront。
        服务端按厂商的单次上限自动分批（七牛 20 条、Cloudflare 30 条、其余 1000 条）。
        CloudFront 只提交 URL 的 path 部分（不含协议、主机与查询串）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
      responses:
        "200":
          description: code=0 成功；code=1 未配置 CDN 凭据

  /api/storage/file:
    get:
      tags: [存储]
      summary: 本地私有文件流（private + local 驱动时可用）
      security:
        - cookieAuth: []
