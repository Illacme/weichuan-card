  # ───────────────────────── 海报个性化设置 ─────────────────────────
  /api/employee/poster-prefs:
    get:
      tags: [员工端]
      summary: 读取本人海报设置（自定义背景 + 版式）
      description: |
        跟着**员工账号**走而不只存本机：员工会换手机、重装微信，只记在
        wx.setStorageSync 里换设备就全丢，还得重挑一遍背景、重调一遍版式。

        响应带 `staffId`（2026-10-28 起）：海报页会被转发给任何人，登录员工
        也完全可能打开**别人**的海报页，端上要靠它判断给不给编辑入口，
        否则还得为这个判断单独打一次 `/api/employee/me`。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: code=0 成功；没存过时 exists=false + 默认版式（不是 404）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/PosterPrefsPayload"
    put:
      tags: [员工端]
      summary: 写入本人海报设置（整体覆盖，upsert）
      description: |
        背景清单与版式都在写入前归一：白名单外的枚举落默认、越界数值夹紧、
        清单超限截断、选中项不在清单里则清空。**不报错**——版式是体验项，
        用户传了个错值不该让整次保存失败（他还得重调一遍）。

        回传归一后的结果：端上据此纠正本地状态（比如上传第 10 张被截断），
        避免「本地显示有、后端没有」的错位。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bgId:
                  type: string
                  description: 当前背景；不在清单里的自定义 id 会被清空
                  example: c-abcdef12
                backgrounds:
                  type: array
                  maxItems: 9
                  items:
                    $ref: "#/components/schemas/PosterBackground"
                layout:
                  type: object
                  description: |
                    版式**补丁**形态：字段可缺省，缺省即保持默认。布尔字段传
                    false 才是「关掉」——这与响应里的完整形态不同，是为了区分
                    「客户端没传」和「客户端明确要关」。
                  properties:
                    template: { type: string }
                    showAvatar: { type: boolean }
                    showName: { type: boolean }
                    showTitle: { type: boolean }
                    showCompany: { type: boolean }
                    showAddress: { type: boolean }
                    showPhone: { type: boolean }
                    showLandline: { type: boolean }
                    showEmail: { type: boolean }
                    showQr: { type: boolean }
                    textColor: { type: string }
                    customText: { type: string }
                    offsetX: { type: integer }
                    offsetY: { type: integer }
                    qrOffsetX: { type: integer }
                    qrOffsetY: { type: integer }
                    qrSize: { type: integer }
                    avatarSize: { type: integer }
      responses:
        "200":
          description: code=0 成功；code=1 参数错误 / 保存失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/PosterPrefsPayload"

  /api/poster-prefs:
    get:
      tags: [公开内容]
      summary: 海报版式公开快照（只读，?staffId=）
      description: |
        **无鉴权**（按 IP 限流 60/分，桶键带 `posterpref:` 前缀，与 login:/track:
        在共享计数表里分家）。

        为什么必须有这个端点：海报页是编辑器而不是图片查看页，转发链接只带
        `staffId`，访客打开时是**当场用「员工名片数据 + 版式」重新生成**一张。
        没有快照，访客看到的就是客户端默认版式——员工调的排版、挑的自定义
        背景、写的那句 slogan 全都传不出去，海报作为「可传播的物料」
        其实根本没被传递，被传递的只是一个生成器的链接。

        与员工端点读同一行数据，只暴露**渲染这一张海报所需的最小集**：
        `backgrounds` 只回当前选中的那一张自定义背景，未选中的（最多 9 张）
        是员工私有素材，不该挂在无鉴权接口上。内置素材 `poster-*` 客户端自带
        清单，一张都不回。

        存在性与停用判定与 `/api/card` 同口径：员工不存在 code=1、已停用 code=2。
      parameters:
        - name: staffId
          in: query
          required: true
          description: 员工编号（与 /api/card 同一个参数）
          schema:
            type: integer
            example: 42
      responses:
        "200":
          description: code=0 成功；code=1 缺少 staffId / 员工不存在 / 查询失败；code=2 员工已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/PosterPrefsPayload"

