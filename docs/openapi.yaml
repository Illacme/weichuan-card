        RFC 5987 中文名），UTF-8 BOM（Excel 直接打开不乱码）+ 公式注入防护
        （以 = + - @ 开头的单元格前置单引号）。
        业务失败（含 401）走 HTTP 200 + JSON 信封——调用方按 `content-type`
        判 `application/json` 再解析 `msg`，不要把错误信封当 CSV 下载。
      security:
