  /api/admin/stats:
    get:
      tags: [超管-员工管理]
      summary: 全局名片统计（汇总 + 按员工 + 按天趋势 + 内容浏览 TOP 榜 + 来源分布 + 裂变榜）
      description: |
        汇总转化三指标（visit/call/save）+ 内容浏览三指标（projectView/serviceView/
        videoPlay）+ 裂变两指标（share/posterSave），并按员工分组（零数据员工补 0）、
        按天趋势，以及按 `target_id` 聚合的 TOP 案例 / TOP 服务榜；另有按 `source`
        聚合的来源分布（sourceDist）与裂变榜（fissionTop）。

        **三组互不相加**（2026-10-27 口径修正，只改分组不改埋点）：
        - 转化：有没有人找上门；
        - 内容浏览：访客对什么内容感兴趣。这三类是唯一带 `targetId`（强制存在且
          同租户）的事件，也只有它们进 TOP 榜——「对什么内容感兴趣」得有对象才答得上；
        - 裂变：把名片传出去的动作。不带 `targetId`，且主体可能是员工本人
          （海报页唯一入口「我的 → 生成海报」只有本人进得去），混进内容浏览会把
          浏览总量抬高。两者都记在「被传播的那张名片的主人」名下。

        TOP 榜对象已删除时 `name` 为「已删除」且**计数不减**——榜单与汇总口径
        对得上，不会出现「汇总 3 条、榜单加起来 2 条」的对账事故。
        与 /api/employee/me/stat（仅本人）互补，供 PC 后台「名片统计」页使用。

        流量来源（source，迁移 0022）：只统计 `visit` 事件，取值经后端白名单归一
        （空串→unknown、脏值→other，白名单外的值永不进分布）。
        - `sourceDist`：回答「扫码 vs 转发 vs 搜索 vs 海报」各占多少；
        - `fissionTop`：`visit` + `source='share_card'` 按员工聚合，回答
          「谁的名片被转发带来的新访客最多」（裂变贡献排行）。
        source 来自客户端，**只作统计维度**，绝不参与权限 / 租户 / 计费判断。
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: 起始日期 YYYY-MM-DD（闭区间，缺省 = 全部时间）
          schema:
            type: string
            example: "2026-10-01"
        - name: to
          in: query
          required: false
          description: 截止日期 YYYY-MM-DD（闭区间，缺省 = 全部时间）
          schema:
            type: string
            example: "2026-10-31"
      responses:
        "200":
          description: code=0 成功；code=1 日期参数错误 / 查询失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        description: |
                          前三项是转化；中间三项是内容浏览（带 targetId，进 TOP 榜）；
                          最后两项是裂变（share / posterSave，不与内容浏览相加）。
                        properties:
                          visit:
                            type: integer
                          call:
                            type: integer
                          save:
                            type: integer
                          projectView:
                            type: integer
                          serviceView:
                            type: integer
                          videoPlay:
                            type: integer
                          share:
                            type: integer
                          posterSave:
                            type: integer
                      byStaff:
                        type: array
                        items:
                          type: object
                          properties:
                            staffId:
                              type: integer
                              format: int64
                            name:
                              type: string
                            title:
                              type: string
                            avatar:
                              type: string
                            visit:
                              type: integer
                            call:
                              type: integer
                            save:
                              type: integer
                            projectView:
                              type: integer
                            serviceView:
                              type: integer
                            videoPlay:
                              type: integer
                            share:
                              type: integer
                            posterSave:
                              type: integer
                      trend:
                        type: array
                        description: |
                          只含范围内有事件的日期（升序）。八项一次给全——前端图例可点选，
                          勾到哪个指标都要有线（默认只画转化三线）。
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              example: "2026-10-21"
                            visit:
                              type: integer
                            call:
                              type: integer
                            save:
                              type: integer
                            projectView:
                              type: integer
                            serviceView:
                              type: integer
                            videoPlay:
                              type: integer
                            share:
                              type: integer
                            posterSave:
                              type: integer
                      topProjects:
                        type: array
                        description: TOP 案例（按 project_view 聚合，最多 10 条）
                        items:
                          $ref: "#/components/schemas/StatTopItem"
                      topServices:
                        type: array
                        description: TOP 服务（按 service_view 聚合，最多 10 条）
                        items:
                          $ref: "#/components/schemas/StatTopItem"
                      sourceDist:
                        type: array
                        description: |
                          流量来源分布：只统计 visit 事件，按归一后的 source 分组
                          （最多 6 类，无数据 = 空数组不是 null）。
                          source 取值见 track 接口的 source 字段说明。
                        items:
                          $ref: "#/components/schemas/StatSourceItem"
                      fissionTop:
                        type: array
                        description: |
                          裂变榜：`visit` + `source='share_card'` 按 staff_id 聚合
                          （最多 10 条，降序），即「谁的名片被转发带来的新访客最多」。
                          员工已删除时 name 为「已删除」。
                        items:
                          $ref: "#/components/schemas/StatFissionItem"

  /api/admin/stats/export:
    get:
      tags: [超管-员工管理]
      summary: 统计 CSV 导出（与 /api/admin/stats 同口径）
      description: |
        同租户隔离、同日期口径。响应为 CSV 文件（`Content-Disposition` 带
        RFC 5987 中文名），UTF-8 BOM（Excel 直接打开不乱码）+ 公式注入防护
        （以 = + - @ 开头的单元格前置单引号）。
        业务失败（含 401）走 HTTP 200 + JSON 信封——调用方按 `content-type`
        判 `application/json` 再解析 `msg`，不要把错误信封当 CSV 下载。
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            example: "2026-10-01"
        - name: to
          in: query
          required: false
          schema:
            type: string
            example: "2026-10-31"
      responses:
        "200":
          description: 成功返回 CSV；失败返回 JSON 信封 {code:1,msg}

  /api/admin/stats/detail:
    get:
      tags: [超管-员工管理]
      summary: 埋点明细（汇总的下钻）
      description: |
        逐条事件，按 id 倒序分页 `{code:0,data,total,page,size}`。
        与 /api/admin/stats 同租户隔离、同日期口径——两边口径必须一致，
        否则「汇总 100、明细 105」是最难排查的事故。
        `targetId` 配 `eventType=project_view|service_view` 用于从 TOP 榜下钻。
        不在白名单内的 eventType 与坏参数一律 code:1（不静默忽略）。
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: staffId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          description: 事件白名单之一；白名单外 code:1
          schema:
            type: string
            example: project_view
        - name: targetId
          in: query
          required: false
          description: 内容对象 ID（配 eventType 下钻 TOP 榜）
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          description: 缺省 1；越界由后端夹到末页并回传夹后的 page
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: 缺省 20，上限 100
          schema:
            type: integer
      responses:
        "200":
          description: code=0 成功；code=1 参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatDetailItem"
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer

