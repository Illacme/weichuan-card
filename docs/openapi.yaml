  /api/admin/companies/{id}/admins/{aid}/reset-password:
    post:
      summary: 平台超管重置企业管理员密码
      description: |
        企业管理员自己改密必须提供原密码，忘了我方无从找回（库里只存哈希），
        唯一的救济入口就是平台超管代重置。

        服务端生成随机初始密码并**只在本次响应里返回一次**（无法回读），由平台超管线下转交。
        重置同时自增该账号的 token_version，其当前所有会话立即失效——这点必须在操作前告知操作人。

        定位按 `id + company_id` 双约束：路径上两个 id 单独看都对、组合起来错配时，不改任何账号。
        仅平台超管可调；开启独立版企业锁定（independent_lock）时返回 code=403。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          description: 企业编号
          schema:
            type: integer
            format: int64
        - name: aid
          in: path
          required: true
          description: 企业管理员编号
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（initialPassword）；code=1 管理员不存在；code=403 独立版锁定只读

  /api/admin/companies/{id}/wechat:
    get:
      summary: 该企业的小程序凭据（只读）
      description: |
        企业独立版小程序（每企业一个 appid、共用同一套后端）用这份凭据生成小程序码；
        未配置时回落到全局 `wx_appid`/`wx_appsecret`，再回落环境变量。

        **appSecret 永不回传**（连 key 都不出现），`configured` 表示 AppID 与 AppSecret 成对非空——
        半配置（只填了 AppID）按「没配」处理，与取值侧口径一致。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（data.appId / data.configured / data.releaseEnabled / data.uploadKeyConfigured）；从没配过也是 code=0 + configured=false，不是错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      appId:
                        type: string
                      configured:
                        type: boolean
                      releaseEnabled:
                        type: boolean
                        description: 是否允许平台代发小程序版本（见 /releases 系列接口）。回包缺省视为 true
                      uploadKeyConfigured:
                        type: boolean
                        description: |
                          是否配了**代码上传密钥**（private.key）。与 appSecret 是两把不同的钥匙：
                          AppSecret 换 access_token 调提审 / 发布接口，上传密钥才能把代码传到微信。
                          只回「配没配」，永不明文回传；该企业没配时上传回落平台全局那份。
    put:
      summary: 保存该企业的小程序凭据（平台超管代填）
      description: |
        `appId` 须以 wx 开头（只卡前缀，其余交给微信侧当裁判）。

        **`appSecret` 传空串 = 清空该企业已存的 Secret 并回落全局小程序**，
        因此「只改 AppID、Secret 不动」做不到——界面会在这种保存前弹二次确认。
        `uploadKey` 同语义：空串 = 清空并改用平台全局上传密钥。

        `releaseEnabled` 不传 = 保持原值（不是重置为 true）。传 false 时平台不能再
        代这家企业提交审核 / 发布 / 撤回小程序版本，登记与列表等只读动作不受影响。

        本接口**不受** independent_lock（独立版企业锁定）限制：那个开关是「别动租户结构」，
        而凭据是阻塞性配置，锁住了会让独立版用户永远配不上小程序。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, appSecret]
              properties:
                appId:
                  type: string
                appSecret:
                  type: string
                  description: 空串 = 清空并回落全局小程序
                uploadKey:
                  type: string
                  description: |
                    代码上传密钥（private.key 文件全文，可含换行）。空串 = 清空并改用平台全局
                    那份（系统设置 `wx_upload_key`）。**只写不读**：不校验格式，格式问题在
                    真正上传时由后端给出具体原因。
                releaseEnabled:
                  type: boolean
                  description: 省略该字段时保持原值；仅在同时提供 appSecret 时有意义（留空清空凭据时开关随之重置）
      responses:
        "200":
          description: code=0；code=1 参数错误 / AppID 格式不对 / 保存失败

  # ── 租户自有对象桶（P1 后半段，迁移 0044）───────────────────────────────
  # 权限：**只有平台超级管理员**（PlatformAdminMiddleware）。企业管理员 role 也是 admin，
  # 用 AuthMiddleware 会直接放行，因此四个接口都不能照抄 /api/admin/storage 那批的写法。
  # 原因：这条配置里装的是客户的云凭据，能改它就能把该企业的文件指到任意桶。
  # 边界：写入与自检一直是可用的；**是否承载流量**由进程的 TENANT_STORAGE_ROUTE 决定
  # （第六十一轮接入，默认 off）。出参 trafficEnabled 回报进程开关，activeForTenant
  # 回报「这家此刻是不是真的在用自有桶」——两者不是一回事，别只取一个。
  /api/admin/companies/{id}/storage:
    get:
      summary: 某企业的自有对象桶配置（平台超管，凭据只回掩码）
      description: |
        未配置时返回 `configured=false` 的完整空视图（不是 404、也不是错误），
        界面据此进入「新建」态——「没配过」与「读失败」必须能分开。

        **AccessKey 只回掩码**（前4****后4），用于核对「现在生效的是不是新那把」；
        `SecretKey 连掩码都不给`，只回 `secretKeyConfigured`。
        库里密文解不开时（`PII_ENC_KEY` 换过）回 `credentialError`，界面据此要求重填。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: code=0（data 见 TenantStorageConfig）；企业管理员调用为 code=403
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  data: { $ref: "#/components/schemas/TenantStorageConfig" }
    put:
      summary: 新建 / 覆盖某企业的自有对象桶配置（平台超管）
      description: |
        布尔与凭据**用「有没有这个字段」区分意图**：省略 = 保持原值，传值 = 覆盖。
        凭据三态：省略 = 保留、空串 = 清空、有值 = 覆盖（服务端 `pii.Encrypt` 加密后落库，
        不接受客户端提交密文）。

        校验复用 `nginxsnippet.Target.Validate` 单点（endpoint 不许带 scheme、bucket 不许含
        路径或 `..`、hostHeader 不许含引号，且必须能判断出路径风格——见 `hostHeader` 字段说明）；
        另加两条**产品边界**：
        第一阶段只支持公开读桶；启用时必须同时具备 AccessKey 与 SecretKey。

        保存成功会把上一次自检结论重置为 `unknown`——否则后台会一直显示一个过期的绿点。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantStorageSave" }
      responses:
        "200":
          description: code=0（data 为保存后的视图）；code=1 参数错误 / 企业不存在 / 校验不通过 / 保存失败；code=403 非平台超管
    delete:
      summary: 切回平台存储（平台超管）
      description: |
        删掉该企业的配置行 = 新上传回到平台盘。**已传进客户桶的对象不会被搬回来**
        （那属于存量搬迁 P3），审计里会显式记 `objectsLeftInBucket=true`。
        没配过时幂等返回 code=0。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: code=0；code=1 删除失败；code=403 非平台超管
  /api/admin/companies/{id}/storage/check:
    post:
      summary: 自有桶连通性自检（平台超管）
      description: |
        **带凭据**去探桶（S3 语义下 HEAD bucket）：不带签名时「不存在」与「存在但无权访问」
        都回 403，探不出任何东西。结果回写 `status` / `last_checked_at` / `last_error`，
        并留审计（成功失败都记）。

        覆盖范围仅有「凭据有效 + 桶可达」：`checkedScope` 字段会明说**不含** nginx 侧
        Host/SNI（漏 SNI 会被桶以 421 拒绝）、CDN 与证书链。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: code=0（data.ok / data.detail / data.error / data.status / data.checkedScope）；未配置时 code=1
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      detail: { type: string, description: 成功时的一句话说明 }
                      error: { type: string, description: 失败原因（已脱敏，不含凭据与桶方响应原文） }
                      status: { type: string, enum: [unknown, ok, error] }
                      lastCheckedAt: { type: string, format: date-time }
                      checkedScope: { type: string, description: 本次自检的覆盖范围与不覆盖项 }

  # ── 租户授权（B4）与存储配额（B3）──────────────────────────────────────
  # 这两个能力默认都是「不限制」：授权只在**开通企业时**落一条试用行，存量企业无行 = 不限；
  # 存储配额全局缺省 0 = 不限。升级不得让存量部署突然开始拦人，因此默认值都是放行。
  /api/admin/companies/{id}/license:
    get:
      summary: 查看某企业的授权状态（平台超管）
      description: |
        没有授权行时**不报错**，返回 `exists=false`——那是「未配置 = 不限制」的合法状态
        （存量企业升级后就是这种），界面据此显示「未配置」。

        `trial` 一并下发当前试用口径，界面用它提示「新开通的企业会拿到 N 席 / M 天」。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（data.exists / edition / seats / expiresAt / features / expired / employeeCount / trial）；code=1 企业不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      companyId:
                        type: integer
                        format: int64
                      exists:
                        type: boolean
                        description: 是否已有授权行。false = 未配置 = 不受席位与到期限制
                      edition:
                        type: string
                        enum: ["", trial, platform, private]
                      seats:
                        type: integer
                        description: 员工席位上限；0 = 不限制
                      expiresAt:
                        type: string
                        description: 到期日 YYYY-MM-DD；空串 = 不过期
                      features:
                        type: string
                        description: 逗号分隔的功能开关；空串 = 全部开通
                      expired:
                        type: boolean
                      employeeCount:
                        type: integer
                        format: int64
                      trial:
                        type: object
                        description: 当前试用口径（开通企业时按它落行）
                        properties:
                          enabled:
                            type: boolean
                          days:
                            type: integer
                          seats:
                            type: integer
    put:
      summary: 设置某企业的授权（转正 / 延期 / 改席位 / 功能开关）
      description: |
        `seats=0` 表示不限席位、`expiresAt` 留空表示不过期——两者都是**正式客户**的常态，
        不是「没填」。因此保存是**全量覆盖**，不是局部更新。

        `expiresAt` 接受 `YYYY-MM-DD`（落库为**当天 23:59:59**：客户理解的「到 12-31 到期」
        是这一天整天才算完，存 00:00 会让人在最后一天上午被停服）或 RFC3339。

        到期后会由 `EnforceLicense` 自动降级只读（写操作返回 `code:2`）——
        **降权是自动的，恢复不是**，续费后必须调本接口把到期日改到未来。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edition:
                  type: string
                  enum: ["", trial, platform, private]
                seats:
                  type: integer
                  minimum: 0
                  maximum: 100000
                expiresAt:
                  type: string
                  description: YYYY-MM-DD 或 RFC3339；空串 = 不过期
                features:
                  type: string
      responses:
        "200":
          description: code=0；code=1 参数错误（版本标识不在白名单 / 席位越界 / 日期格式错）/ 企业不存在 / 保存失败

  /api/admin/storage:
    get:
      summary: 某租户的存储用量与配额
      description: |
        企业管理员看本企业；平台超管用 `?companyId=`（缺省 1 号企业）。
        「空间还剩多少」是日常运营信息，不是特权，因此两种角色都能看。

        **口径**：用量是「自本功能启用起累计的上传量」，历史文件不回溯
        （对象存储无租户元数据、本地 `/uploads` 是扁平目录，硬凑估算更误导）；
        覆盖写（`SaveBytes` 的三个固定名对象）不扣减。它回答「谁还在往里塞东西」，
        不是「磁盘上谁占了多少」。
      tags: [租户]
      parameters:
        - name: companyId
          in: query
          required: false
          description: 平台超管可指定；企业管理员忽略此项
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（data.bytes / files / quotaBytes / quotaMb / percent / humanBytes / humanQuota / unlimited / quotaGlobal）；code=1 无法确定租户 / 查询失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      companyId:
                        type: integer
                        format: int64
                      bytes:
                        type: integer
                        format: int64
                      files:
                        type: integer
                        format: int64
                      quotaBytes:
                        type: integer
                        format: int64
                        description: 生效配额（字节）；0 = 不限
                      quotaMb:
                        type: integer
                        description: 该租户的**覆盖值**；0 = 未单独设置、跟随全局
                      percent:
                        type: integer
                      humanBytes:
                        type: string
                      humanQuota:
                        type: string
                      unlimited:
                        type: boolean
                      quotaGlobal:
                        type: integer
                        description: 全局兜底值 `storage_quota_mb`（0 = 不限）

  /api/admin/storage/quota:
    put:
      summary: 设置某企业的存储配额覆盖（平台超管）
      description: |
        `quotaMb=0` = 跟随全局 `storage_quota_mb`（全局缺省也是 0 = 不限）。
        上限 1TB：再大就不是配额而是笔误。

        只改 `quota_mb`，**不动** `bytes`/`files`——那两列是累计事实，调配额不该清零用量。
      tags: [租户]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, quotaMb]
              properties:
                companyId:
                  type: integer
                  format: int64
                quotaMb:
                  type: integer
                  minimum: 0
                  maximum: 1048576
      responses:
        "200":
          description: code=0；code=1 参数错误 / 企业不存在 / 保存失败

  # ── 小程序版本发布（平台代租户上传 / 提审 / 发布）──────────────────────
  # 分工：**上传代码有两条路**——后台自己传（走内嵌的 miniprogram-ci，Node 脚本）
  # 或 CI 传完后由后台登记版本号；提审 / 查状态 / 发布 / 撤回始终由后端调微信接口。
  # 状态机见 backend/internal/model/mp_release.go，只有白名单内的流向才放行。
  /api/admin/companies/{id}/releases:
    get:
      summary: 该企业的版本列表（分页）
      description: |
        只读，**不受** `releaseEnabled` 开关与 independent_lock 限制——企业要能看见自己的历史版本。

        响应遵循统一分页约定：`data` 是**当前页数组**，`total`/`page`/`size` 与 `data` 同级放在顶层。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          required: false
          description: 按状态过滤，可重复（逗号分隔亦可）；见 MPReleaseStatus 枚举
          schema:
            type: string
      responses:
        "200":
          description: code=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MPRelease"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    type: integer
    post:
      summary: 登记一个「CI 已上传」的版本 → draft
      description: |
        **不调任何微信接口**：代码是 CI 传的，后台只把版本号与描述记下来，
        让后续提审 / 发布有据可查。也因此**无法在此校验版本号是否真的传过**——
        写错只影响记录显示，提审时微信拿它自己收到的那份代码，错版本的后果由审核环节暴露。

        企业 + 版本号唯一：重复登记返回 code=1（别让人为同一份代码提两次审）。
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userVersion]
              properties:
                userVersion:
                  type: string
                  description: 1-64 位字母/数字/点/横线/下划线，须与 CI 上传时一致，如 1.2.0
                userDesc:
                  type: string
                  description: 这版改了什么，最多 255 字
      responses:
        "200":
          description: code=0（data 为新建记录）；code=1 参数/格式错误、企业不存在；code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/MPRelease"

  /api/admin/companies/{id}/releases/upload-readiness:
    get:
      summary: 上传前探活：环境缺什么一次列全
      description: |
        只读，**不写审计、不调 node**。把后台上传代码的前置条件逐项查一遍：
        node 可执行、miniprogram-ci 模块、小程序源码目录、上传密钥。
        `problems` 刻意**一次列全**（不是遇到第一个就返回）——让运维一次性补齐，
        而不是「改一项再刷新看下一项」。

        界面在打开上传弹窗时调它，缺项直接摆在表单上方，缺项未清前禁用提交按钮。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0；`data.ready=false` 不是错误，是「还不能传」
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      problems:
                        type: array
                        items:
                          type: string
                      keyConfigured:
                        type: boolean
                        description: 该企业自己配了上传密钥（false 时会用平台全局那份）

  /api/admin/companies/{id}/releases/upload:
    post:
      summary: 后台上传小程序代码到微信（成为体验版）并建 draft 记录
      description: |
        调内嵌的 Node 脚本跑 miniprogram-ci 的 `upload`。**不需要任何人装微信开发者工具**——
        这是它与「登记版本」的本质差别：登记只是记一笔，这里是真的把源码传上去。

        前置条件（缺任一返回 code=1，**不会**启动 node，也不建记录）：
          - 服务器有 node（`MP_NODE_BIN`，默认 `node`）；
          - `MP_CI_MODULE_DIR`（或 `MP_SOURCE_DIR`）下装过 `miniprogram-ci`；
          - `MP_SOURCE_DIR` 指向小程序源码目录；
          - 上传密钥：该企业自己的（`uploadKey`）或平台全局（`wx_upload_key`）任一份非空；
          - 企业 + 版本号未被占用。

        **同步执行、分钟级**：编译 + 上传都在这次请求里做完，反代超时
        （nginx `proxy_read_timeout`）必须大于 `MP_UPLOAD_TIMEOUT_SEC`。

        成功后**自动建一条 `source=backend` 的 draft 记录**，版本号就是这次真实上传的
        那个号——从根上杜绝「填的版本号」和「实际传的版本号」不是同一个。
        失败则**不建记录**，只写一条失败审计（避免运营以为只差提审而白扣审核额度）。

        上传密钥只以 0600 临时文件形式存在、用完即删，不进 argv / stdout / 审计明细。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userVersion]
              properties:
                userVersion:
                  type: string
                  description: 1-64 位字母/数字/点/横线/下划线，会成为体验版版本号，如 1.2.0
                userDesc:
                  type: string
                  description: 项目备注，会展示在微信公众平台，最多 200 字
      responses:
        "200":
          description: |
            code=0（data 为新建的 draft 记录）；
            code=1 参数/格式错误、环境未就绪、上传失败；
            code=2 **代码已上传成功但记录保存失败**——此时切勿重复上传（版本号已占用），
            先去后台补一条同版本号的登记；
            code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/MPRelease"

  /api/admin/releases/{id}/submit-audit:
    post:
      summary: 提交审核（draft / rejected / withdrawn → auditing）
      description: |
        调微信 `/wxa/submit_audit`。**MVP 不传 item_list**，类目取后台已配的。

        两条硬约束（提笔前想清楚）：
          - **提审消耗审核额度**；从 rejected / withdrawn 重新提审会**再扣一次**；
          - 上传代码后需等微信侧代码检测结束才能提审，否则报 61039。

        成功后才把本地记录改成 auditing。微信报错时本地记录保持原状、并写一条失败审计。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（data.auditId 为微信审核单号）；code=1 状态不允许 / 凭据问题 / 微信报错；code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/MPRelease"

  /api/admin/releases/{id}/audit-status:
    get:
      summary: 拉一次微信审核状态并按需同步本地记录
      description: |
        调微信 `/wxa/get_auditstatus`。微信 status：0 审核成功 / 1 被拒（带 reason）/ 2 审核中 / 3 已撤回 / 4 延后。
        其中 4（延后）本地仍记为 auditing——它不是一个独立的业务态，只是「还没审完」。

        回包除记录本身外多两个字段：`wxStatus`（微信原始枚举）与 `changed`（本地记录是否因这次查询而变动），
        以及非终态时的 `note`。**没有 auditId（还没提审）时返回 code=1**。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0；code=1 尚未提审 / 凭据问题 / 微信报错；code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    allOf:
                      - $ref: "#/components/schemas/MPRelease"
                      - type: object
                        properties:
                          wxStatus:
                            type: integer
                            description: 微信原始审核状态枚举
                          changed:
                            type: boolean
                            description: 本地记录是否因这次查询而变动
                          note:
                            type: string

  /api/admin/releases/{id}/release:
    post:
      summary: 发布（audit_passed → released）
      description: |
        调微信 `/wxa/release`。**发布直接改变该企业小程序的线上行为、对全部用户立即生效**，
        且微信侧不支持「再发一次同一版本」——要再动就得走新一轮 上传→提审→发布。
        只有 audit_passed 态允许，其余一律拒绝（白名单见状态机）。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: code=0（data.releasedAt 为上线时间）；code=1 状态不允许 / 凭据问题 / 微信报错；code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/MPRelease"

  /api/admin/releases/{id}/undo-audit:
    post:
      summary: 撤回审核（auditing → withdrawn）
      description: |
        调微信 `/wxa/undo_code_audit`。**撤回不返还已消耗的审核额度**，撤回后要再上线
        必须重新提审（再扣一次）。因此本接口要求 `confirm: true` 才执行——把「不可逆」
        这件事做成显式参数，而不是只在界面上弹个窗。
      tags: [版本发布]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: 必须为 true，否则返回 code=1
      responses:
        "200":
          description: code=0；code=1 confirm 不为 true / 状态不允许 / 凭据问题 / 微信报错；code=403 该企业关闭了平台代发
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/MPRelease"

  /api/wechat/msgpush:
    get:
      summary: 微信消息推送 URL 校验（echo）
      description: |
        在微信公众平台配置「消息推送」URL 时，微信会发一个带 signature/timestamp/nonce/echostr 的 GET 请求来校验地址可达。
        本端点验签通过后原样回显 echostr；验签失败返回 403。
        与 POST 共用同一路径，靠 HTTP 方法区分（GET=校验，POST=接收事件）。
      tags: [内容安全]
      parameters:
        - name: signature
          in: query
          required: true
          schema: { type: string }
        - name: timestamp
          in: query
          required: true
          schema: { type: string }
        - name: nonce
          in: query
          required: true
          schema: { type: string }
        - name: echostr
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 验签通过，原样回显 echostr（纯文本）
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: 验签失败
        "503":
          description: 未配置推送 Token
    post:
      summary: 微信消息推送接收（图片检测结论回来）
      description: |
        微信把图片 / 音频内容安全（/wxa/media_check_async）的检测结论通过「消息推送」推到本端点。
        支持明文与安全模式（EncodingAESKey 解密）两种，验签必做。
        无论能否识别事件，都返回纯文本 "success"（微信只认这个，回别的会触发重推，
        连续失败会停掉整条推送通道，导致图片检测永久收不到结论）。
      tags: [内容安全]
      parameters:
        - name: msg_signature
          in: query
          required: false
          description: 安全模式下的签名（与明文 signature 二选一，由 encrypt_type=aes 或本字段存在判定安全模式）
          schema: { type: string }
        - name: signature
          in: query
          required: false
          schema: { type: string }
        - name: timestamp
          in: query
          required: false
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          schema: { type: string }
        - name: encrypt_type
          in: query
          required: false
          schema: { type: string, enum: [raw, aes] }
      responses:
        "200":
          description: 纯文本 "success"（含「非媒体事件」「检测中」「已落库」等所有情况）
          content:
            text/plain:
              schema: { type: string, example: success }
        "400":
          description: 密文 body 解析失败 / 解密失败
        "403":
          description: 验签失败
        "500":
          description: 结论落库失败（微信按退避策略重推）
        "503":
          description: 未配置推送 Token / 安全模式但未配 EncodingAESKey

  /api/admin/media-checks:
    get:
      summary: 图片内容安全检测记录列表（平台超管 / 企业管理员）
      description: |
        异步图片检测的送检与结论记录。状态：pending（已送检等回调）/ pass / review（疑似，建议人工复核）/
        risky（命中违规）/ failed（送检或微信侧检测失败）。
        **租户隔离**：平台超管（company_id=0）看全部，企业管理员只看本企业。
      tags: [内容安全]
      parameters:
        - $ref: "#/components/parameters/CompanyScope"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          required: false
          description: 按状态过滤
          schema:
            type: string
            enum: [pending, pass, review, risky, failed]
        - name: onlyTakedownable
          in: query
          required: false
          description: "1 = 只看可下架（risky 且未处置）"
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: code=0；code=403 非管理员
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MediaCheck" }
                  total: { $ref: "#/components/schemas/PageTotal" }
                  page: { $ref: "#/components/schemas/PageIndex" }
                  size: { $ref: "#/components/schemas/PageSize" }

  /api/admin/media-checks/config:
    get:
      summary: 图片检测推送配置状态（给后台显示还缺什么）
      description: |
        直接把「要让图片检测跑起来还缺什么」回给后台：小程序凭据、推送 Token、
        EncodingAESKey 是否就绪，以及应填到微信公众平台的推送 URL。运营据此把缺失项补上。
      tags: [内容安全]
      responses:
        "200":
          description: code=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  data: { $ref: "#/components/schemas/MediaCheckConfig" }

  /api/admin/media-checks/{id}/takedown:
    post:
      summary: 一键下架违规图片（覆盖成占位图）
      description: |
        仅「命中违规（risky）且未处置且推得出对象键」的记录可下架。下架 = 把同名对象覆盖成
        「内容不可用」占位图（按扩展名选 PNG/JPEG），并触发 CDN 刷新 + 记审计。**不可逆**，故不自动下架，留人工兜底。
      tags: [内容安全]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: "code=0 成功；code=1 参数错误 / 记录不存在 / 记录不可下架 / 下架失败；code=403 无权操作该企业记录"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  msg: { type: string }

  /api/client-error:
    post:
      tags: [可观测性]
      summary: 前端报错上报（无鉴权公开端点）
      description: |
        浏览器侧异常（Vue 运行时 / window.onerror / 未捕获 Promise 拒绝）回传服务端，
        以 `[CLIENT-ERROR]` 前缀写日志并带 requestId，可与后端同一次请求的日志串起来排查。

        **刻意无鉴权**：报错可能发生在登录前、匿名页或令牌失效瞬间，要求鉴权反而上报不出去。
        代价是它成了潜在刷日志入口，因此用三道闸兜住（详见下方）：
        1. 每 IP 固定窗口限流：1 分钟内最多 60 条，超限返回 `{code:429}`；
        2. 请求体硬上限 64KB（`io.LimitReader`），挡住超大体；
        3. 字段裁剪（message≤2000 / stack≤4000 / url≤1000 / ua≤300 字节等），防单条撑爆日志。
        仅 message 与 stack 都为空时报废（视为垃圾，不写日志）。
        **只写日志不落库**——C1 的诉求是「出事服务端能收到信号」，日志流已满足；聚合查询另议。
        DEV 下前端只 `console.warn` 不发请求，故本端点在开发环境不会收到噪音。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorPayload" }
      responses:
        "200":
          description: |
            code=0 已记录（写 `[CLIENT-ERROR]` 日志）；
            code=1 业务拒绝（空 payload / JSON 解析失败）；
            code=429 限流命中（窗口内该 IP 上报超 60 条）。
            注意：限流返回的是 **HTTP 200 + body.code=429**（与全局「鉴权失败走 body.code」约定一致），
            前端 / 测试据此判断，而非 HTTP 状态码。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  msg: { type: string }

  # ───────────────── 微信绑定管理（P1：清单 / 反查 / 解绑） ─────────────────
  # 三条端点都挂在 backend/internal/handler/admins.go 的 RegisterAdmins 内部，
  # 与「账号管理」同组。设计底线见 backend/internal/handler/wechat_admin.go 文件头：
  # 后台只能解绑、绝不代绑；openid 只进不出；解绑同时自增 token_version 踢掉已签发令牌。
  /api/admin/wechat/bindings:
    get:
      tags: [账号]
      summary: 微信绑定清单（服务端分页，只列已绑定账号）
      description: |
        合并 `admins.wx_openid` 与 `employees.openid` 两张表，只列**已绑定**的账号：
        这里是「可解绑对象」列表，未绑定的行没有可执行动作，而「谁没绑」由 P0 的
        三个账号页各自展示。

        - 两类管理员都可用；`scopeCond` 按身份收窄：企业管理员只见本企业，
          平台超管不传 `companyId` 时看全部企业。
        - `keyword` 匹配账号名 / 企业名 / 掩码 / 编号；`kind` 按 admin / employee 收窄。
          两者都在**分页之前**过滤，`total` 是筛后真实条数（否则翻页会翻出空白页）。
        - 员工姓名是 PII 密文列，SQL 的 LIKE 打不到明文，故过滤在 Go 侧对已解密行做。
        - 回包只有 `wechatBound` 与 `wxOpenidMasked`，**绝不回 openid 原文**。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/CompanyScope"
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 账号名 / 企业名 / 掩码 / 编号模糊匹配
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [admin, employee] }
          description: 账号类型；非法值按「全部」处理
      responses:
        "200":
          description: code=0（越界页码夹到末页并回传夹后的 page）；code=401 未登录；code=1 查询失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WechatBindingRow" }
                  total: { $ref: "#/components/schemas/PageTotal" }
                  page: { $ref: "#/components/schemas/PageIndex" }
                  size: { $ref: "#/components/schemas/PageSize" }

  /api/admin/wechat/lookup:
    post:
      tags: [账号]
      summary: 按完整 openid 反查绑定了哪些账号（仅平台超管）
      description: |
        方向是「输入完整 openid → 输出账号」，**反过来不行**：这是把微信身份关联到
        后台账号 / 企业的少数入口，跨租户关联查询只给平台超管
        （`PlatformAdminMiddleware`，企业管理员返回 `{code:403}`）。

        - `openid` 长度上限 128 字符，防止本端点变成任意长度字符串的全表扫描放大器；
          这不是格式校验，不要在服务端试图「验证 openid 长得对不对」。
        - **openid 只进不出**：请求体是唯一允许出现完整原文的地方；响应只回掩码，
          审计 Detail 连掩码都不写，只记 `admin_count` / `employee_count` 两个条数。
        - 只读却破例留痕 `wechat.lookup`：谁在什么时候查过哪个微信必须有据可查。
          查无此号也会记一条（条数为 0）。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openid]
              properties:
                openid:
                  type: string
                  maxLength: 128
                  description: 完整 openid（仅上行，响应不回显）
      responses:
        "200":
          description: |
            code=0（查无此号时 data 为空数组）；code=1 空值 / 超长 / 查询失败；
            code=401 未登录；code=403 非平台超管。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  msg: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WechatBindingRow" }
                  total:
                    type: integer
                    description: 命中条数（此端点不分页）

  /api/admin/wechat/unbind:
    post:
      tags: [账号]
      summary: 后台代解绑微信（清绑定 + 踢掉已签发令牌）
      description: |
        **只能解绑，绝不代绑**：绑定必须账号本人在小程序用一次性 code 经
        `code2session` 换取，后台不提供任何写入 openid 的接口。

        - `kind=admin` 按 `admins.id`，`kind=employee` 按 `employees.staff_id` 定位；
          两张表主键各自自增，`id` 不可跨类型复用。
        - `scopeCond` 同时收窄查询与 UPDATE 的 WHERE：企业管理员只能解绑本企业账号，
          越权时返回「账号不存在（或不在本企业）」且不落库。
        - 单条 `Updates` 一次完成「清绑定 + `token_version + 1`」：分两条 UPDATE 之间
          进程挂掉会留下「绑已解、手机上令牌还有效」的窗口。安全戳自增后该账号
          已签发的所有令牌立即失效（含后台当前会话），需重新用账号密码登录。
        - `self=true` 表示解的是当前登录的管理员账号，前端必须据此登出重登。
          员工与管理员分属两张表，员工 `staff_id` 与 `admin.id` 数值撞车不算 self。
        - 未绑定 / 重复解绑明确拒绝，不制造第二条审计。写库成功后才记
          `admin.wx_unbind` / `employee.wx_unbind`，Detail 只有 `companyId`，
          不写姓名 / openid / 掩码。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind:
                  type: string
                  enum: [admin, employee]
                id:
                  type: integer
                  format: int64
                  description: admins.id 或 employees.staff_id，取决于 kind
      responses:
        "200":
          description: |
            code=0 已解绑；code=1 参数错误 / 账号不存在（或不在本企业）/ 该账号未绑定微信 /
            解绑失败；code=401 未登录。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: "#/components/schemas/Code" }
                  msg: { type: string }
                  self:
                    type: boolean
                    description: 解的是当前登录账号；为 true 时本次响应之后旧令牌即失效
                  companyId: { type: integer, format: int64 }

components:
  # 分页约定（管理端列表统一）：请求 ?page=&size=，响应 data 为**当前页数组**，
  # total/page/size 放在顶层。实现见 backend/internal/handler/pagination.go。
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100

    # 多租户作用域：平台超管「当前正在管理哪家企业」。
    # 前端不逐接口传——api/request.ts 的请求拦截器统一给 /admin/** 补上，
    # 值来自顶栏企业选择器（store/tenant.ts）。理由见 info.description「多租户作用域」。
    CompanyScope:
      name: companyId
      in: query
      required: false
      description: |
        目标企业 id。**仅平台超管（admins.company_id=0）有效**：企业管理员传了也会被忽略，
        后端始终按令牌里的 company_id 收窄（防越权读改别家企业）。

        平台超管不传时有两种历史行为，都容易让人误解，所以界面强制先选企业：
        统计 / 审核 / 员工类走 `tenantScope`，缺省是「全部企业」；
        企业内容类走 `targetCompanyID`，缺省**回落 1 号企业**——「改着 A 家内容写进
        1 号企业」就是这么来的。
      schema:
        type: integer
        format: int64

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "小程序端 access 令牌（Authorization: Bearer <token>）"
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: PC 管理后台 httpOnly Cookie（浏览器自动携带）

  schemas:
    Code:
      type: integer
      description: 0=成功；1=业务失败；2=特殊状态；401=未登录/失效；403=无权限；429=限流
      enum: [0, 1, 2, 401, 403, 429]

    TenantStorageConfig:
      type: object
      description: |
        某企业的自有对象桶配置视图（迁移 0044）。**凭据永不出参**：AccessKey 只回掩码，
        SecretKey 只回「是否已配置」。
      properties:
        companyId: { type: integer, format: int64 }
        configured:
          type: boolean
          description: 是否已配置。false 不是错误，只表示该企业走平台存储
        driver:
          type: string
          enum: [local, minio, oss, s3]
          description: local = 不生成接入层 snippet，对象留在平台盘
        endpoint:
          type: string
          description: host[:port]，**不带 scheme**（同时喂给 nginx snippet）
        bucket: { type: string }
        region: { type: string, description: 仅 OSS / S3 需要；MinIO 可空 }
        useSsl:
          type: boolean
          description: 为 true 时接入层必须给 proxy_ssl_server_name + proxy_ssl_name，否则被桶 421 拒绝
        hostHeader:
          type: string
          description: >-
            Host 头（也是 TLS SNI 取值）。**它同时决定路径风格**：留空或等于 endpoint =
            路径风格（生成器把桶名写进 path，即 `/<bucket>/<key>`）；以 `<bucket>.` 开头 =
            虚拟主机风格（Host 已带桶名，path 只留对象键）。两者都不是的取值会被拒绝——
            猜错的那一侧不会报错，只会让该企业的图全部裂开。
            hostHeader 是回源侧发给桶的 Host / TLS SNI；客户自有访问域名填 publicBaseUrl，
            两者正交，不要拿自有域名来解释这条拒绝（旧版文案的「下一阶段」是误导）。
        publicRead:
          type: boolean
          description: >-
            第一阶段必须为 true：私有桶需要预签名链路，尚未实现。
            写入侧 validateTenantStorageRow 与上传侧 uploadroute.build 都会显式拒绝 false
            （回填侧不受影响：凭据在手就能写对象，公开读与否只影响端上能否直接取）。
        enabled: { type: boolean, description: 关掉即回平台存储；driver=local 时同样不生成 snippet }
        publicBaseUrl:
          type: string
          description: >-
            客户自有访问域名，纯 origin（http(s)://host[:port]）；空串 = 走平台统一入口。
            写入时由 storage.ValidatePublicOrigin 归一化，与出参 ResolveRef 的 origin 校验同源。
            它是访客侧 origin，与 hostHeader（回源侧 Host / TLS SNI）正交。
        publicBaseUrlActive:
          type: boolean
          description: >-
            该域名此刻是否真的改变了出参 URL。第六十八轮**恒为 false**：
            出参侧按租户选 origin（ResolveRef 的 origin 参数）尚未接入，
            本字段目前只做登记 + 校验 + 如实回报。界面不许把它渲染成「已切换」。
        publicBaseUrlNote:
          type: string
          description: publicBaseUrl 非空时给超管看的「为什么没生效 / 生效前还要做什么」；空值时为空串
        status:
          type: string
          enum: [unknown, ok, error]
          description: unknown = 配了但没验过（不要渲染成「正常」）
        lastError:
          type: string
          description: 最近一次自检的脱敏摘要；不含凭据、不含桶方响应原文
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        accessKeyConfigured: { type: boolean }
        secretKeyConfigured: { type: boolean }
        accessKeyMasked: { type: string, description: 前4****后4；为让运维核对生效的是哪一把 }
        credentialError:
          type: string
          description: 非空说明库里密文解不开（PII_ENC_KEY 与写入时不一致），需重新填一次密钥
        trafficEnabled:
          type: boolean
          description: >-
            本进程是否已开启租户存储路由（TENANT_STORAGE_ROUTE），进程级。默认 false。
            它回答的是「配置保存后能不能生效」，**不是**「这家企业此刻在不在用自有桶」。
        activeForTenant:
          type: boolean
          description: >-
            该企业此刻的文件是否真的写进自己的桶。与 trafficEnabled 不是一回事：
            开关开着但这家的 enabled=false 时仍为 false。
        inactiveReason:
          type: string
          description: >-
            activeForTenant=false 时的原因（未配置 / 未启用 / 驱动是 local /
            进程未开路由 / 凭据不完整）。五种成因处置方式不同，故直接回文案。

    TenantStorageSave:
      type: object
      description: |
        布尔与凭据用「有没有这个字段」区分意图：**省略 = 保持原值**，传值 = 覆盖。
        这与企业小程序凭据的 releaseEnabled 同一条纪律——界面只改一项时，
        不带其他字段不能等于把它们重置掉。
      required: [driver, endpoint, bucket]
      properties:
        driver: { type: string, enum: [local, minio, oss, s3] }
        endpoint: { type: string, description: "host[:port]，不要带 scheme" }
        bucket: { type: string }
        region: { type: string }
        useSsl: { type: boolean }
        hostHeader: { type: string }
        publicRead: { type: boolean }
        enabled: { type: boolean }
        publicBaseUrl:
          type: string
          description: >-
            客户自有访问域名，纯 origin（http(s)://host[:port]）。省略 = 保留原值；
            空串 = 清空；有值 = 服务端归一化后覆盖。目前只登记，不会改变出参 URL
            （见 TenantStorageConfig.publicBaseUrlActive）。
        accessKey:
          type: string
          description: 省略 = 保留原值；空串 = 清空；有值 = 覆盖（服务端加密后落库，不接受密文）
        secretKey:
          type: string
          description: 同 accessKey 三态

    MediaCheck:
      type: object
      description: 图片 / 音频内容安全检测记录（异步送检 → 消息推送回调 → 后台下架）
      properties:
        id: { type: integer, format: int64 }
        companyId: { type: integer, format: int64 }
        url: { type: string, description: 送检时的绝对地址，也是下架时覆盖对象的定位依据 }
        objectKey: { type: string, description: 存储对象键；为空表示推不出，不允许下架 }
        mediaType: { type: integer, description: 1 音频 / 2 图片 }
        scene: { type: integer }
        source: { type: string, enum: [employee, admin, apply] }
        traceId: { type: string, description: 微信侧追踪号（申诉与排障都要它） }
        status:
          type: string
          enum: [pending, pass, review, risky, failed]
        suggest: { type: string, description: 微信原始 suggest（pass / review / risky） }
        label: { type: integer, description: 违规标签 }
        raw: { type: string, description: 微信回调原文（申诉证据） }
        note: { type: string, description: 跳过 / 失败原因 }
        action: { type: string, description: '"" 未处置 / takedown 已下架' }
        handledAt: { type: string, nullable: true, format: date-time }
        handlerId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MediaCheckConfig:
      type: object
      description: 图片检测推送配置状态（给后台显示还缺什么）
      properties:
        enabled: { type: boolean, description: 内容安全开关（系统设置 content_sec_enabled） }
        tokenReady: { type: boolean, description: 推送 Token 是否已配 }
        aesReady: { type: boolean, description: EncodingAESKey 是否已配（仅安全模式需要） }
        credReady: { type: boolean, description: 小程序 AppID / AppSecret 是否已配 }
        pushUrl: { type: string, description: 应填到微信公众平台的消息推送 URL }
        pending: { type: integer, description: 待结论（pending）记录数 }
        risky: { type: integer, description: 命中违规且未处置的记录数 }
        takedownReady: { type: boolean, description: 下架能力是否就绪（恒 true，占位兼容前端） }

    ClientErrorPayload:
      type: object
      description: 前端报错上报载荷（POST /api/client-error；无鉴权，三道闸限流/体积/裁剪）
      required: [message]
      properties:
        message: { type: string, description: 错误描述；与 stack 都为空时报废（不记录） }
        stack: { type: string, description: 错误堆栈（截断到 4000 字节） }
        url: { type: string, description: 出错页面 URL（默认前端填 location.href，截断到 1000 字节） }
        line: { type: integer, description: 出错行号（window.onerror 提供） }
        column: { type: integer, description: 出错列号（window.onerror 提供） }
        level:
          type: string
          description: 级别；error / warning / unhandledrejection，缺省 error
          enum: [error, warning, unhandledrejection]
        env: { type: string, description: 前端运行环境（import.meta.env.MODE，如 dev / production） }
        requestId: { type: string, description: 最近一次后端响应头的 X-Request-Id，用于关联后端日志（截断到 64 字节） }
        userAgent: { type: string, description: 浏览器 UA（截断到 300 字节） }
        extra: { type: string, description: 附加上下文（如 Vue errorHandler 的 info；截断到 1024 字节） }

    # ── 分页元信息（与 data 同级，见 components/parameters 的分页约定）──
    PageTotal:
      type: integer
      description: 符合条件的总条数（不是当前页条数）
    PageIndex:
      type: integer
      description: 实际生效的页码（越界时后端会夹到末页并回传夹后的值）
    PageSize:
      type: integer
      description: 实际生效的每页条数（缺省 20，上限 100）

    CompanyItem:
      type: object
      description: 企业列表项（含员工 / 管理员数量 / 小程序凭据是否配好）
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        employeeCount:
          type: integer
        adminCount:
          type: integer
        wxConfigured:
          type: boolean
          description: 该企业是否已配好独立小程序凭据（AppID + AppSecret 成对非空）；false 时生成小程序码回落到平台全局凭据
        storageBytes:
          type: integer
          format: int64
          description: |
            已用存储（字节）。口径是**自本功能启用起累计的上传量**，不是磁盘真实占用
            （历史文件无法可靠归属租户，见 model.StorageUsage 的注释）
        licenseExists:
          type: boolean
          description: 是否有授权行。false = 未配置 = 不受席位与到期限制（存量企业升级后即此状态）
        licenseEdition:
          type: string
          enum: ["", trial, platform, private]
        licenseSeats:
          type: integer
          description: 员工席位上限；0 = 不限制
        licenseExpiresAt:
          type: string
          description: 到期日 YYYY-MM-DD；空串 = 不过期
        licenseExpired:
          type: boolean
          description: 是否已过期（过期后该企业后台只读：能登录看，不能改）
        createdAt:
          type: string
          format: date-time

    Employee:
      type: object
      properties:
        staffId:
          type: integer
          format: int64
        name:
          type: string
        title:
          type: string
        avatar:
          type: string
        phone:
          type: string
        phone2:
          type: string
          description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
        landline:
          type: string
          description: 座机
        email:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        createdAt:
          type: string
          format: date-time
        openid:
          type: string
          description: |
            **脱敏后的** openid（首字符 + **** + 后四位），未绑定为空串。
            后台列表只回掩码：openid 是「持有即可换登录令牌」的标识，
            原文发给浏览者等于把别人的登录凭据摊开。列表关键字仍按库里的明文
            openid 做 LIKE，展示脱敏不影响检索能力。
            例外：PIPL 查阅复制权的单员工导出接口返回员工本人的完整 openid。
        wechatBound:
          type: boolean
          description: 是否已绑定微信（决定能否一键登录）。前端不该靠判断 openid 是否为空来推断

    MpEntry:
      type: object
      description: 小程序默认入口设置（`GET /api/admin/mp-entry`）
      properties:
        mode:
          type: string
          enum: [wall, staff]
          description: 配置原值——管理员设的
        staffId:
          type: integer
          format: int64
          description: mode=staff 时指定的员工；0 表示未指定
        effectiveMode:
          type: string
          enum: [wall, staff]
          description: |
            生效值——访客实际看到的。与 `mode` 不一致说明指定员工已停用/被删除，
            服务端回落到了名片墙；界面必须把这件事说出来。
        staffName:
          type: string
          description: 指定员工的姓名（明文；员工 PII 列由服务端解密）
        staffTitle:
          type: string
        staffAvatar:
          type: string
        staffStatus:
          type: string
          enum: ["", enabled, disabled]
          description: 空串=未指定员工
        staffMissing:
          type: boolean
          description: 指定员工记录已不存在（被删除），与「停用」分开提示

    CompanyInfo:
      type: object
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyInfoInput:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
        address:
          type: string
        tel:
          type: string
        logo:
          type: string

    CompanyProfile:
      type: object
      properties:
        introText:
          type: string
          description: 富文本
        videoSource:
          type: string
          enum: [none, channels, upload, url, tencent]
          description: >-
            视频来源，决定小程序端渲染哪一档：none 不展示视频（显示封面占位）；
            channels 微信视频号（存储与流量由微信承担，官方声明该组件无视听资质要求）；
            upload 云存储上传（对象存储直传，不经应用服务器）；
            url 外部 MP4 直链（流量与资质由客户承担）；
            tencent 腾讯视频插件（txv-video vid：原位播放、无视频号角标、能记播放埋点；
            默认不可选，需先在系统设置「功能开关」开启「腾讯视频档」——该档依赖小程序
            侧静态声明插件，未授权会让整个小程序编译失败。开启后 videoVid 必填）。
            **upload 与 url 在小程序端是同一个分支**（都渲染原生 video），后台界面已把
            两者合并成「自托管 MP4（上传或直链）」一档供选择，但**接口取值不变**：
            仍分别提交 upload / url，本枚举不接受 mp4。
        videoChannelId:
          type: string
          description: 视频号 ID，sph 开头（留档用；定位具体视频靠 videoFeedId）
        videoFeedId:
          type: string
          description: 视频号视频 feedId，**仅同主体生效**（可自动播放，优先）
        videoFeedToken:
          type: string
          description: >-
            跨主体凭证。官方明确 feed-id「仅同主体时生效」，视频号与小程序不同主体时必须改用它
            （基础库 2.31.1+，非个人主体小程序），代价是强制 autoplay=false。
            与 videoFeedId 二选一，videoFeedId 非空时本字段不生效
        videoVid:
          type: string
          description: 腾讯视频 vid（预留字段，当前不可选）
        videoUrl:
          type: string
          description: >-
            MP4 地址：upload / url 两档作为主视频源；channels / tencent 两档开启兜底时作为回落源。
            小程序端会自动补成绝对地址。
        videoBackupUrl:
          type: string
          description: >-
            自托管 MP4（upload / url）档的备用地址：主 MP4 加载失败且开启兜底时自动切换。
            与 videoUrl 分开存，避免保存主源时把备用地址覆盖掉。channels / tencent 两档不使用此字段。
        videoFallbackUrl:
          type: boolean
          description: >-
            是否启用兜底：channels / tencent 档主源失败时改用 videoUrl；
            upload / url 档主 MP4 失败时改用 videoBackupUrl。
        videoAutoplay:
          type: boolean
          default: false
          description: >-
            进页面是否自动播放。腾讯视频插件的 autoplay 默认是 true（与原生 video 相反），
            服务端会把此值原样下发给小程序，端上再显式写入 txv-video；
            `/api/card` 的 profile 里同名字段是小程序唯一的读取口径。默认 false（不自动播放）
        cover:
          type: string

    CompanyProfileInput:
      type: object
      properties:
        introText:
          type: string
        videoSource:
          type: string
          enum: [none, channels, upload, url, tencent]
        videoChannelId:
          type: string
        videoFeedId:
          type: string
        videoFeedToken:
          type: string
        videoVid:
          type: string
        videoUrl:
          type: string
        videoBackupUrl:
          type: string
          description: 自托管 MP4 档的备用地址；不传按空串处理，存量行不受影响
        videoFallbackUrl:
          type: boolean
        videoAutoplay:
          type: boolean
          description: 是否自动播放；缺省（不传）按 false 处理
        cover:
          type: string

    AchievementCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
        sort:
          type: integer
        isLocked:
          type: boolean

    ProjectCase:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          description: JSON 数组字符串（列表接口）；详情接口解析为字符串数组
          type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [categoryId, name]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        isHomeFeatured:
          type: boolean
        enabled:
          type: boolean
        sort:
          type: integer

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        detail:
          type: string
        cover:
          type: string
        album:
          type: array
          items:
            type: string
        categoryId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    BizService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: >-
            富文本。视频块为 <wx-video …></wx-video>，type 属性区分三种来源（缺省 channels）：
            type="tencent" vid="…"（腾讯视频，插件取片）；type="mp4" src="…"（MP4 直链，域名需在小程序业务域名白名单）；
            无 type 时为视频号块 <wx-video feed-id="…" feed-token="…" channel-id="sph_…"></wx-video>，
            优先级 feed-id（同主体，可自动播放）> feed-token（跨主体，强制不能自动播放）>
            channel-id（视频号 ID，sph 开头，仅在两者都缺失时回退展示视频号主页，兼容存量内容）
        sort:
          type: integer
        createdAt:
          type: string
          format: date-time

    OpenApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        phone2:
          type: string
          description: 第二个手机号（选填）；名片上与主号并列展示，不参与登录
        email:
          type: string
        title:
          type: string
        avatar:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time

    CardModifyApply:
      type: object
      properties:
        id:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
        snapshot:
          type: string
          description: JSON：变更字段 {avatar,name,title,phone,email}
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time

    SettingItem:
      type: object
      description: |
        系统设置项（GET /api/admin/settings）。三档生效方式见 secret / restart / readOnly。
      properties:
        key:
          type: string
          description: 配置项标识（环境变量风格，界面降级为次要灰字展示）
        name:
          type: string
          description: 中文名（界面主标签）；为空时前端回落显示 key
        group:
          type: string
          enum: [general, miniprogram, upload, wechat, auth, storage, security, feature]
        type:
          type: string
          enum: [int, string, bool, string_slice]
        description:
          type: string
        value:
          type: string
          description: 当前值；敏感项（secret=true）恒为掩码 "******"
        secret:
          type: boolean
        restart:
          type: boolean
          description: 保存后需重启进程才生效
        readOnly:
          type: boolean
          description: 只读项，PUT 会被拒绝（只能改环境变量）
        envVar:
          type: string
          description: 对应环境变量名；留空时回退它
        options:
          type: array
          items:
            type: string
          description: 枚举候选值（仅枚举项有，如 storage_driver 的 local/minio/oss/s3）；界面据此渲染下拉，缺失时按文本框渲染
        configured:
          type: boolean
        pathKind:
          type: string
          enum: [node_bin, module_dir, source_dir]
          description: >
            服务端路径类配置（仅后台上传小程序代码那三项有）：驱动界面在文本框旁渲染
            「浏览服务器目录」按钮，弹出服务端路径选择器挑路径（而非浏览器原生文件框，
            后者选的是客户端机器，对这些指向服务器的配置没意义）

    PathEntry:
      type: object
      description: 服务端目录列表里的一项
      properties:
        name:
          type: string
        path:
          type: string
          description: 完整绝对路径
        type:
          type: string
          enum: [dir, file]
        marker:
          type: string
          description: 徽标（如「小程序工程目录」「已装 miniprogram-ci」「node 可执行文件」），空串表示不像正确答案

    PathSuggestion:
      type: object
      description: 自动探测到的候选路径
      properties:
        path:
          type: string
        label:
          type: string
          description: 默认取路径末段作为展示名
        reason:
          type: string
          description: 为什么它像正确答案（如「含 project.config.json」）

    PathStatus:
      type: object
      description: 某个路径作为当前项时的校验结果（与后端 CheckPath 同源口径）
      properties:
        ok:
          type: boolean
        message:
          type: string

    PathBrowseResult:
      type: object
      description: 一次服务端目录浏览的结果（GET /api/admin/settings/paths）
      properties:
        kind:
          type: string
          enum: [node_bin, module_dir, source_dir]
        path:
          type: string
          description: 实际列举的目录（已解析符号链接）
        selected:
          type: string
          description: |
            当前「待选中」的路径。node_bin 下可能是所列举目录里的某个可执行文件，
            其余类型就是目录本身。界面据此高亮列表项、决定「选择此路径」是否可点。
        selectedIsDir:
          type: boolean
          description: selected 是否目录（node_bin 借此区分「还没选到文件」）
        parent:
          type: string
          description: 上一级目录，供 UI 回退
        home:
          type: string
          description: 当前用户家目录，供 UI 一键回家
        entries:
          type: array
          description: 本目录下的子项。**恒为数组**（无内容时是 []，不是 null）——界面按数组消费
          items:
            $ref: "#/components/schemas/PathEntry"
        truncated:
          type: boolean
          description: 是否因超过上限（300）被截断
        current:
          $ref: "#/components/schemas/PathStatus"
        suggestions:
          type: array
          description: 自动探测到的候选。**恒为数组**（无候选时是 []，不是 null）
          items:
            $ref: "#/components/schemas/PathSuggestion"

    PlatformAdmin:
      type: object
      description: |
        平台超管列表（`GET /api/admin/platform-admins`）与企业管理员列表
        （`GET /api/admin/companies/{id}/admins`）共用这一形状。
        `admins.wx_openid` 在模型上标了 `json:"-"`，因此这里绝不会出现 openid 原文。
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        wechatBound:
          type: boolean
          description: 是否绑定了小程序端免密登录用的微信
        wxOpenidMasked:
          type: string
          description: 脱敏后的 openid（首字符 + **** + 后四位）；未绑定为空串

    AuditLog:
      type: object
      description: |
        操作审计记录。只追加不修改；敏感值在 detail 里只记「已修改」。
      properties:
        id:
          type: integer
          format: int64
        actorType:
          type: string
          enum: [admin, employee, anonymous, system]
          description: system = 后台定时任务 / 异步动作（如清理、CDN 刷新失败），不是「未登录的人」
        actorId:
          type: integer
          format: int64
        actorName:
          type: string
          description: 冗余用户名：账号被删除后仍可追溯是谁操作的
        companyId:
          type: integer
          format: int64
        action:
          type: string
          example: setting.update
        targetType:
          type: string
          example: admin
        targetId:
          type: string
        detail:
          type: string
          description: JSON 变更摘要；敏感值脱敏为 "******"
        ip:
          type: string
        result:
          type: string
          enum: [success, fail]
        createdAt:
          type: string
          format: date-time

    LicenseSelf:
      type: object
      description: |
        当前登录者所在视角的那一份授权（客户看到的横幅就来自这里）。
        阈值 30 / 7 天，判定集中在 `internal/license/expiry.go`。

        `daysLeft` 按**日历天**算（两边先归到本地零点再取整），不按小时：
        到期落库是当天 23:59:59，若用 `Hours()/24`，早上 9 点看「明天到期」会算出 0.6 →
        显示 1 天，而客户心里的答案是「明天」。
      properties:
        edition:
          type: string
          example: trial
        seats:
          type: integer
          description: 席位数；0 = 不限
        seatsUsed:
          type: integer
        seatsFull:
          type: boolean
          description: 已满（新建员工会被拦，返回 code=403）
        expiresAt:
          type: string
          description: 到期日（YYYY-MM-DD）；未配置授权时为空串
          example: "2026-11-09"
        daysLeft:
          type: integer
          description: 剩余日历天；已过期为负数
          example: 7
        expired:
          type: boolean
        level:
          type: string
          description: |
            none = 未配置（不限制）；ok = 30 天以上；warn = 30 天内；
            urgent = 7 天内；expired = 已过期
          enum: [none, ok, warn, urgent, expired]
          example: urgent
        title:
          type: string
          example: 授权 2026-11-09 到期，仅剩 7 天
        consequence:
          type: string
          description: 到期后果（仅 warn / urgent / expired 时有值），按部署形态分文案
        renewHint:
          type: string
          description: 续费方式（同上）。平台：无需重启；私有部署：换 data/license.key 并重启

    LicenseExpiringItem:
      type: object
      description: |
        临期清单里的一条（仅平台超管可见）。字段是**摊平**的，不嵌 `status`——
        前端拿到就直接渲染一行，不必多剥一层。
      properties:
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        edition:
          type: string
        seats:
          type: integer
        expiresAt:
          type: string
          description: 到期日（YYYY-MM-DD）
        daysLeft:
          type: integer
        expired:
          type: boolean
        level:
          type: string
          enum: [none, ok, warn, urgent, expired]
        title:
          type: string
          example: 授权 2026-11-09 到期，仅剩 7 天

    LicenseView:
      type: object
      properties:
        mode:
          type: string
          description: 部署形态。private 下续费必须换 data/license.key 并重启
          enum: [platform, private]
        scope:
          type: string
          enum: [platform, tenant]
        self:
          $ref: "#/components/schemas/LicenseSelf"
        alerts:
          type: object
          description: |
            平台超管才有的汇总计数。**包含关系**：expired ⊆ within7 ⊆ within30，
            前端必须拆成互斥段（within7 - expired、within30 - within7）再拼句子。
          properties:
            expired:
              type: integer
            within7:
              type: integer
            within30:
              type: integer
        expiring:
          type: array
          description: 临期清单（仅平台超管），过期优先、其后按剩余天数升序，最多 10 条
          items:
            $ref: "#/components/schemas/LicenseExpiringItem"

    MPReleaseStatus:
      type: string
      description: |
        版本生命周期。合法流转只有白名单里的几条（见 backend/internal/model/mp_release.go）：

            draft      → auditing        提交审核
            auditing   → audit_passed    轮询发现审过
            auditing   → rejected        轮询发现驳回
            auditing   → withdrawn       撤回审核
            audit_passed → released      发布
            rejected   → auditing        重新提审（再扣一次额度）
            withdrawn  → auditing        重新提审（再扣一次额度）
            released   → （终态，无出路）

        `draft → released`（跳过审核）与 `audit_passed → auditing`（审过又退回审核）
        都不存在，是刻意的。
      enum: [draft, auditing, audit_passed, released, rejected, withdrawn]

    MPRelease:
      type: object
      description: |
        一条小程序版本记录。代码包本身**不在此存储**——上传有两条路：
        后台自己传（`source=backend`，走 miniprogram-ci）或 CI 传完由后台登记
        （`source=ci` / `manual`），库里只留版本号、状态与微信审核单号，
        让「哪一版审到哪一步」可查。
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
          description: 0 = 平台自有小程序
        appId:
          type: string
          description: 登记时用的小程序 AppID；动作时会与当前凭据比对，不一致即拒绝
        userVersion:
          type: string
        userDesc:
          type: string
        status:
          $ref: "#/components/schemas/MPReleaseStatus"
        statusName:
          type: string
          description: 状态中文名（待提审 / 审核中 / 审过待发布 / 已上线 / 已驳回 / 已撤回）
        auditId:
          type: integer
          format: int64
          description: 微信审核单号；未提审为 0。不建唯一索引——驳回后重新提审会拿到新单号
        auditReason:
          type: string
          description: 微信给的驳回原因，仅 rejected 态有值
        source:
          type: string
          enum: [backend, ci, manual]
          description: backend=后台上传（自动建记录，版本号即真实上传的那个）；ci=CI 上传后登记；manual=手工登记
        operatorId:
          type: integer
          format: int64
        submittedAt:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StatTopItem:
      type: object
      description: |
        内容浏览 TOP 榜的一行：按 target_id 聚合出的对象与次数。
        对象被删除时 name 为「已删除」且计数不减（与汇总口径对得上）。
      properties:
        targetId:
          type: integer
          format: int64
        name:
          type: string
          example: 车间改造
        count:
          type: integer

    PosterBackground:
      type: object
      description: |
        一张自定义背景图。id 由客户端生成（`c-` + 随机），后端只校验格式；
        file 只接受站内相对路径或 http(s) 绝对地址（它最终会进 canvas 的 img.src）。
      properties:
        id:
          type: string
          example: c-abcdef12
        name:
          type: string
          example: 活动照
        file:
          type: string
          example: /uploads/2026/10/my-bg.jpg

    PosterLayout:
      type: object
      description: |
        海报版式。存库与回传都用这个「完整形态」（每个字段都有具体值），
        写入则用同名的指针形态（bool 用指针才能区分「没传」和「明确关闭」）。
        白名单外的枚举值落默认、越界数值夹紧，**不报错**——版式是体验项，
        传错值不该让整次保存失败。
      properties:
        template:
          type: string
          enum: [classic, center, minimal, card, split, left, stack, poster]
          example: center
        showAvatar: { type: boolean }
        showName: { type: boolean }
        showTitle: { type: boolean }
        showCompany: { type: boolean }
        showAddress: { type: boolean }
        showPhone: { type: boolean }
        showLandline: { type: boolean, description: 默认关（老海报不该突然多一行） }
        showEmail: { type: boolean, description: 默认关，同上 }
        showQr: { type: boolean, description: 默认开——它是整张海报唯一的落地入口 }
        textColor:
          type: string
          enum: [auto, light, dark]
        customText:
          type: string
          maxLength: 30
          description: 一句话宣传语，按 rune 截断，换行压成空格（canvas 不认 \n）
        offsetX: { type: integer, description: 信息区横向位移，±480 夹紧 }
        offsetY: { type: integer }
        qrOffsetX: { type: integer, description: 二维码位移，与信息区各自独立 }
        qrOffsetY: { type: integer }
        qrSize:
          type: integer
          description: 码尺寸档位；0 = 自动（按内容高度自适应）
          enum: [0, 76, 104, 140]
        avatarSize:
          type: integer
          enum: [56, 72, 88]

    PosterPrefsPayload:
      type: object
      description: |
        海报设置响应体。员工端与公开快照**同一形状**，端上不必分两套解析。
      properties:
        staffId:
          type: integer
          description: |
            设置所属员工（2026-10-28 起带）。端上据此判断「这张名片是不是我的」
            ——海报页会被转发给任何人，登录员工也可能打开别人的海报页。
        bgId:
          type: string
          description: 当前背景；空串 = 白底，`poster-*` = 内置素材，`c-*` = 自定义
        backgrounds:
          type: array
          description: |
            自定义背景清单。员工端给**全部**（他自己的素材库）；公开快照只给
            **当前选中的那一张**——未选中的那几张是私有素材，不该挂在无鉴权接口上。
          items:
            $ref: "#/components/schemas/PosterBackground"
        layout:
          $ref: "#/components/schemas/PosterLayout"
        exists:
          type: boolean
          description: |
            false = 服务端没有可信记录（新员工 / 从没调过）。此时员工端沿用本机缓存，
            公开快照端一律从默认值重算。

    StatSourceItem:
      type: object
      description: |
        流量来源分布的一行：按归一后的 source 分组出的来源与次数。
        取值恒在白名单内（scan/share_card/search/poster/unknown/other），
        故前端可直接做「占全部访问的比例」条形图。
      properties:
        source:
          type: string
          enum: [scan, share_card, search, poster, unknown, other]
          example: share_card
        count:
          type: integer

    StatFissionItem:
      type: object
      description: |
        裂变榜的一行：`visit` + `source='share_card'` 按员工聚合出的贡献与次数。
        员工已从库里删除（硬删除）时 name 为「已删除」。
      properties:
        staffId:
          type: integer
          format: int64
        name:
          type: string
          example: 张三
        count:
          type: integer

    StatDetailItem:
      type: object
      description: 埋点明细的一行（汇总的下钻）
      properties:
        id:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
        name:
          type: string
        eventType:
          type: string
          enum:
            [visit, call, save, project_view, service_view, video_play, share, poster_save]
        statDate:
          type: string
          example: "2026-10-22"
        createdAt:
          type: string
          description: "YYYY-MM-DD HH:mm:ss，已按服务端 TZ 格式化"
          example: "2026-10-22 14:30:00"
        targetId:
          type: integer
          format: int64
          description: 关联对象 ID；0 = 无对象
        targetName:
          type: string
          description: 对象名；无对象为「—」，已删除对象为「已删除」

    # 安装向导请求体：被 /api/setup/test 与 /api/setup/install 两条路径共用，
    # 本文件其余部分沿用「就地内联 schema」的写法，故这里单独抽取。
    SetupInstallReq:
      type: object
      description: 安装/测试连接的扁平表单，与后端 `setup.InstallReq` 字段一一对应
      properties:
        engine:
          type: string
          enum: [mysql, sqlite]
          description: 缺省按 mysql 处理
        dbHost:
          type: string
          example: mysql
        dbPort:
          type: string
          example: "3306"
        dbUser:
          type: string
          example: root
        dbPassword:
          type: string
          description: 仅上行，响应与日志不回显
        dbName:
          type: string
          example: weichuan
          description: 仅字母数字下划线（服务端白名单校验，防注入）
        createDatabase:
          type: boolean
          description: 仅 MySQL：库不存在时 CREATE DATABASE IF NOT EXISTS
        sqlitePath:
          type: string
          example: ./data/weichuan.db
        adminUser:
          type: string
          example: admin
        adminPass:
          type: string
          description: ≥8 位，且不能是内置缺省口令
        adminPass2:
          type: string
          description: 必须与 adminPass 一致（装完登不进去的第一大原因）
        jwtKey:
          type: string
          description: 留空由服务端 crypto/rand 生成；不能是内置缺省密钥
        cookieSecure:
          type: boolean
          description: true 时写入 COOKIE_SECURE=true（站点已启用 https）
        loadDemoData:
          type: boolean
          default: false
          description: |
            是否装载演示企业数据（朗汇机电整套样板：企业信息 + 8 个业绩分类 +
            10 个项目案例 + 4 项服务 + 配套图片素材 + 2 个演示账号）。
            **默认 false，商用版装完就是零业务数据**：由平台超管先在「企业管理」
            新建企业，再逐步录入内容。仅供 /api/setup/install 使用（/test 忽略该字段）。

    # 微信绑定清单 / 反查共用的展示行（P1）。
    # 刻意不含 openid 原文：掩码只是「大概是哪一个」的肉眼核对，
    # 精确定位走 /api/admin/wechat/lookup，方向正好反过来。
    WechatBindingRow:
      type: object
      required: [kind, id, name, companyId, companyName, wechatBound, wxOpenidMasked, createdAt]
      properties:
        kind:
          type: string
          enum: [admin, employee]
        id:
          type: integer
          format: int64
          description: kind=admin 是 admins.id；kind=employee 是 employees.staff_id（两表主键各自自增）
        name:
          type: string
          description: 管理员用户名 / 员工姓名（员工侧为解密后的明文）
        companyId:
          type: integer
          format: int64
          description: 0 = 平台超管
        companyName:
          type: string
          description: 企业简称优先，缺省回落「企业 #id」；companyId=0 显示「平台」
        wechatBound:
          type: boolean
          description: 是否已绑定。清单只列已绑定账号；反查命中行同样恒为 true
        wxOpenidMasked:
          type: string
          description: 首字符 + **** + 后四位；未绑定为空串。**绝不回 openid 原文**
        createdAt:
          type: string
          format: date-time
