      description: >-
        供后台「公司简介 → 视频来源」判断「云存储上传」档能否选择。
        videoUpload 为 true 的条件是：驱动为对象存储（非本地磁盘）且实现了直传预签名。
        本地磁盘驱动下上传视频会占用应用服务器磁盘与出网带宽，故必须禁用该档。
      security:
