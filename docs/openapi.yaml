  # ===== 操作审计日志（只读）=====
  /api/admin/audit-logs:
    get:
      summary: 查询操作审计日志（平台超管）
      description: |
        记录后台写操作与登录失败：谁在什么时候、对什么对象做了什么、成功没有。
        **只提供查询**：审计记录一旦可改就等于没有审计。
        敏感值（密钥 / 密码 / 连接串）在 detail 里只记「已修改」，绝不落明文。
      tags: [审计]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: action
          in: query
          required: false
          description: 如 setting.update / admin.reset_password / login.fail
          schema:
            type: string
        - name: actorType
          in: query
          required: false
          schema:
            type: string
            enum: [admin, employee, anonymous]
        - name: actorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, fail]
      responses:
        "200":
          description: code=0；code=403 非平台超管
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"

  # ===== 授权状态与到期提醒（登录即可访问，按角色分视角）=====
  /api/admin/license:
    get:
      summary: 当前视角的授权状态与到期提醒
      description: |
        「到期自动降权」这件事必须有人知道，所以提醒分三层，本接口提供前两层：
        ① **企业管理员**只拿 `self`（自己那份授权）；
        ② **平台超管**额外拿 `alerts` + `expiring`（跨租户临期清单，过期优先、最多 10 家）。

        第三层是运维告警：后端每天扫一次写 `[LICENSE][EXPIRING]`，由
        `scripts/alert_check.sh` 的 R5 推送 webhook——那是**唯一不需要有人登录**的通道，
        也是私有部署（没有平台后台，且到期即拒绝启动）唯一的指望。

        `alerts` 三个计数是**包含关系**（expired ⊆ within7 ⊆ within30），
        前端拼句子前必须拆成互斥段，否则「已过期 1 / 7 天内 2 / 30 天内 3」加不出 3 来。

        `consequence` / `renewHint` 只在 level 属 warn / urgent / expired 时返回，且
        **按部署形态分文案**：平台 / SaaS 续费即时生效、无需重启；私有部署必须换
        `data/license.key` **并重启**。
      tags: [授权]
      responses:
        "200":
          description: code=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    $ref: "#/components/schemas/LicenseView"

  # ===== 租户（企业）管理：仅平台超管 =====
  /api/admin/companies:
    get:
      summary: 企业列表（含员工数 / 管理员数 / 小程序凭据是否配好）
      description: |
        服务端分页：page/size 见「分页约定」。员工数与管理员数按当前页的企业批量统计，
        不是逐企业 COUNT。`wxConfigured` 同理一次 IN 查询（要求 AppID 与 AppSecret 成对非空），
        用于让平台一眼看出哪些企业还缺小程序凭据——缺了的企业员工生成海报小程序码时
        会静默回落到平台小程序。
      tags: [租户]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: keyword
          in: query
          required: false
          description: 模糊匹配企业名称 / 简称
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [enabled, disabled]
      responses:
        "200":
          description: code=0；code=403 非平台超管
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: "#/components/schemas/Code"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyItem"
                  total:
                    $ref: "#/components/schemas/PageTotal"
                  page:
                    $ref: "#/components/schemas/PageIndex"
                  size:
                    $ref: "#/components/schemas/PageSize"
    post:
      summary: 开通企业（可选一并创建企业管理员）
      description: |
        简称（shortName）：PC 后台侧边栏品牌名缺省「微传名片」；显式填写的值同时作为
        公司信息简称的初始值，此后两者相互独立。
        seedCategories：是否复制业绩分类模板（经典业绩 8 类，只带名称与排序）。
        **不传按 true 处理**——零数据版新企业一个分类都没有，企业管理员登录后业绩页空白、
        小程序业绩 Tab 也渲染不出来，必须先有分类才能录案例。模板分类 icon 为空、
        isLocked=false，客户可改名可删；确实一个都不要的显式传 false。
        independent_lock 开启时整体只读，写操作一律 code=403。
      tags: [租户]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                shortName:
                  type: string
                loginCode:
                  type: string
                  description: 登录页白标码（登录页 ?company= 命中后显示该企业简称）。小写字母 / 数字 / 连字符，全局唯一；留空表示不配置
                adminUsername:
                  type: string
                  description: 与 adminPassword 必须同时填写或同时留空
                adminPassword:
                  type: string
                seedCategories:
                  type: boolean
                  default: true
                  description: 是否复制业绩分类模板（8 类骨架）。省略 = 复制；false = 一个都不建
      responses:
        "200":
          description: code=0（data.id / data.name / data.shortName）；code=1 参数错误 / 用户名已存在

  /api/admin/companies/{id}:
    put:
      summary: 编辑企业（名称 / 简称）
      tags: [租户]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                shortName:
                  type: string
      responses:
        "200":
          description: code=0；code=1 未找到

