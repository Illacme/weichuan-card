server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不回显版本号：`Server: nginx/1.31.7` 等于把「该打哪个 CVE」直接告诉扫描器
    server_tokens off;

    # 上传文件可能包含图片/短视频，放宽请求体上限
    client_max_body_size 50m;

    # 基础安全响应头（always = 4xx/5xx 也带，否则错误页反而是最容易被嵌入的那一页）
    # 不加 CSP：Vue 构建产物里有内联样式，一套拍脑袋写出来的 CSP 会直接把页面打白。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 全站是管理后台，没有可索引内容；robots.txt 只挡守规矩的爬虫，外链/预览不看它，
    # 所以响应头也要标（第三道是 index.html 的 <meta name="robots">）。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # E3: 文本类资源开启 gzip。媒体/已压缩二进制（png/jpg/webp/woff2/mp4）开了
    # 体积几乎不变还白烧 CPU，故 gzip_types 只列文本与可压缩字体（ttf/otf）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # 健康检查必须直通后端，**不能被下面的 SPA 兜底接住**。
    # try_files 会把 /healthz/ready 回退成 index.html 并返回 200 —— 而 index.html 是
    # nginx 自己的静态文件，后端进程已死、数据库连不上、反代 502，这个地址照样是 200。
    # 后果是整条监控链静默失效：alert_check 的 R1（本地探活）与 R4（外部拨测）、
    # preflight 第 10 节的外部可达性、以及外部 LB/k8s 的 HTTP 探针全部永远绿。
    #
    # 用 `^~ /healthz` 而不是 `= /healthz`：后端有三个端点，精确匹配只覆盖裸路径，
    # 子端点（/healthz/live、/healthz/ready）会掉进下面的 try_files 变成 HTML。
    # 前缀匹配一条覆盖全部四个路径，且前缀本身不带尾斜杠——带斜杠时 nginx 会把它
    # 当目录建模，对 /healthz 触发内建 auto_redirect（301 到 /healthz/），
    # 与后端的 RedirectTrailingSlash 互踢成死循环（线上真实踩过）。
    # 优先级上 `^~` 高于普通前缀 `location /`，与下面 SPA 兜底的书写顺序无关。
    location ^~ /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加，理由见下面 /api/ 处的长注释
        proxy_set_header X-Forwarded-For $remote_addr;
        # 探活失败要快速返回（默认 60s 会把告警脚本自己拖到超时）
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # SPA（Vue history 模式）兜底：非 /api、非静态资源都回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # E3: SPA 壳 index.html 必须可随时失效（每次发版都可能换它引用的 hash 资源），
    # 故禁止强缓存、每次向服务端校验（304 仍走本地）。精确的 = 匹配优先级最高，且
    # try_files 兜底内部重写到 /index.html、以及 index 指令对 / 的内部重定向都会命中这里。
    # nginx add_header 继承陷阱：server 级的三个安全头只在「本 location 无任何 add_header」
    # 时继承；这里自己加了 Cache-Control，会把 server 级安全头吞掉，故需重新声明。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # E3: 构建产物（/assets/ 下文件名带内容 hash，内容变则文件名变）可放心永久缓存。
    # immutable 告诉浏览器连 304 校验都省了——绝大多数命中走内存/磁盘，不发请求。
    # 同样因 add_header 继承陷阱，安全头在此重新声明。
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # 后端 REST 接口反代
    #
    # 后台上传小程序代码：同步执行、分钟级（编译 + 传代码都在这一次请求里跑完）。
    # 它若落到下面 60s 的 /api/，会在上传途中先返回 504——而代码可能已经传到微信了：
    # 前端看到失败、后台没有 draft 记录，运营再点一次就撞上「版本号已占用」。
    # 正则 location 优先于前缀 location，故这里单独放宽（仅用 CI 上传可整段删掉）。
    location ~ ^/api/admin/companies/[0-9]+/releases/upload$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 这里必须**覆盖**，不能用 $proxy_add_x_forwarded_for（追加）。
        #
        # 追加会把客户端自带的 X-Forwarded-For 原样留在链的左侧，只在自己后面补一段。
        # 后端的可信网段是私有网段（同机 / docker bridge / k8s / 内网 LB 都落在里面），
        # 而反代自己正好是其中一个地址——于是 gin「从右往左跳过可信代理、取第一个
        # 不可信地址」的逻辑，跳过反代后拿到的那一项**恰恰是客户端伪造的值**。
        # 实测：后端收窄可信网段、nginx 仍用追加，伪造头 14/14 全部放行，
        # 登录限流照样被绕过（也就等于超管口令可无限爆破）。
        #
        # 覆盖后 XFF 只剩一项 = TCP 对端真实地址，后端怎么解析都取不到伪造值。
        # 若前面还有一层 CDN / 公网 LB：请改用 real_ip 模块并限定来源网段
        #   set_real_ip_from <CDN网段>;  real_ip_header X-Forwarded-For;  real_ip_recursive on;
        # 此时 $remote_addr 已经是真实客户端 IP，本行不用改。
        # （切勿 set_real_ip_from 0.0.0.0/0 —— 那等于把「信任谁」交给客户端决定。）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # 本地存储文件（头像 / 相册 / 小程序码）：backend 以 /uploads 静态托管
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
