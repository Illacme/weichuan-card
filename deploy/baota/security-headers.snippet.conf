# 安全响应头 · 直接复制粘贴用（宝塔站点配置）
#
# 为什么单独放一个文件：deploy/baota/nginx-site.conf 是带大量注释的参考版，
# 粘贴时容易漏行。这个文件只有要粘的东西。
#
# ⚠️ 如果整份配置都可以替换，直接用 deploy/baota/nginx-site.live.conf，
#    那个是完整且验证过的版本，本文件只是「只想补几个头」时的最小改动方案。
#
# 位置：宝塔面板 → 网站 → weichuan.ziyuanxingqiu.cn → 设置 → 配置文件
#
# 一共 4 个头，要写进**每一个带 add_header 的 location**（见文末的继承陷阱）。
#
# ─────────────────────────────────────────────────────────────
# 【第 1 处】server { 里面，紧跟在 root 那一行之后
# ─────────────────────────────────────────────────────────────
#
#     root /www/wwwroot/weichuan.ziyuanxingqiu.cn/frontend;
#
#     # === 安全响应头（server 级，覆盖 /api/ /uploads/ /healthz 与 SPA 兜底）===
#     add_header X-Content-Type-Options nosniff always;
#     add_header X-Frame-Options SAMEORIGIN always;
#     add_header Referrer-Policy strict-origin-when-cross-origin always;
#     add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#
# ─────────────────────────────────────────────────────────────
# 【第 2 处】location = /index.html 里面
# ─────────────────────────────────────────────────────────────
#
# 找不到就搜 `location = /index.html`，它现在应该长这样（只有一行 add_header）。
# 把整块替换成下面这个：
#
#     location = /index.html {
#         add_header Cache-Control "no-cache" always;
#         add_header X-Content-Type-Options nosniff always;
#         add_header X-Frame-Options SAMEORIGIN always;
#         add_header Referrer-Policy strict-origin-when-cross-origin always;
#         add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#     }
#
# ─────────────────────────────────────────────────────────────
# 【第 3 处】location ~* ^/assets/ 里面
# ─────────────────────────────────────────────────────────────
#
# 同样整块替换：
#
#     location ~* ^/assets/ {
#         add_header Cache-Control "public, max-age=31536000, immutable" always;
#         add_header X-Content-Type-Options nosniff always;
#         add_header X-Frame-Options SAMEORIGIN always;
#         add_header Referrer-Policy strict-origin-when-cross-origin always;
#         add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#     }
#
# ─────────────────────────────────────────────────────────────
# 【第 4 处】/uploads/ 的反代 location（有缓存头就必须重复整组）
# ─────────────────────────────────────────────────────────────
#
# 如果你按 nginx-site.live.conf 把 /uploads/ 拆成了 wxacode/ 与其余两条，
# 那两条各要一份（缓存头不同，安全头相同）。见 live.conf 里 `location /uploads/` 段。
#
# ═════════════════════════════════════════════════════════════
# 为什么每个 location 都要重复写一遍？—— nginx 的 add_header 继承陷阱
# ═════════════════════════════════════════════════════════════
#
# nginx 的规则是：**location 里只要出现任何一个 add_header，就完全不再继承
# server 级的所有 add_header**。不是"覆盖同名的那一个"，是整组都不继承。
#
# 我们的 /assets/、/index.html、/uploads/ 各自要发 Cache-Control，所以它们里面
# 已经有 add_header 了 —— 如果不重复声明，这些最常被访问的路径上反而一个安全头都没有。
# 这类问题不会报错、页面也正常，只有安全扫描或者抓包才看得出来。
#
# 漏掉 X-Robots-Tag 的后果最隐蔽：它恰好写在 `location = /index.html` 上，
# 而所有 SPA 深链（/console/companies 等）都靠 try_files 内部重定向到这个 location
# —— 漏一处，全站页面都可被索引。
#
# ═════════════════════════════════════════════════════════════
# 四个头各自防什么
# ═════════════════════════════════════════════════════════════
#
# X-Content-Type-Options: nosniff
#   禁止浏览器"猜"内容类型。否则一个被上传成 .jpg 的 HTML 文件会被当页面执行
#   （上传功能是这类攻击最常见的入口）。本项目上传目录 /uploads/ 尤其需要。
#
# X-Frame-Options: SAMEORIGIN
#   禁止别的站点用 iframe 套住我们的页面做点击劫持 —— 把后台套在透明 iframe 里，
#   诱导管理员点"删除企业"，实际点的是攻击者摆好的按钮。
#
# Referrer-Policy: strict-origin-when-cross-origin
#   跨站跳转时不把完整 URL 带给对方。后台 URL 里有 ?company=123 这类参数，
#   不加这个头会随 Referer 一路泄露出去。
#
# X-Robots-Tag: noindex, nofollow, noarchive
#   本站是管理后台，没有可索引内容。robots.txt 只挡守规矩的爬虫，
#   外链和聊天软件预览不看 robots.txt，所以响应头也要标。
#   （第三道防线是 frontend/index.html 的 <meta name="robots">。）
#
# ─────────────────────────────────────────────────────────────
# 验证（粘贴保存后，宝塔会自动 nginx -t + reload）
# ─────────────────────────────────────────────────────────────
#
#   # 首页：四个头都要有
#   curl -sI https://weichuan.ziyuanxingqiu.cn/index.html \
#     | grep -iE 'x-content-type-options|x-frame-options|referrer-policy|x-robots-tag'
#
#   # 静态资源：四个头 + immutable 都要有（带 ?cb= 绕开 CDN 缓存）
#   curl -sI "https://weichuan.ziyuanxingqiu.cn/assets/<任一hash文件名>.js?cb=$RANDOM" \
#     | grep -iE 'cache-control|x-content-type-options|x-frame-options|referrer-policy|x-robots-tag'
#
#   # 后端接口：四个头也要在（JSON 响应同样需要 nosniff）。
#   # 返回 401/404 都正常，这里只看头，不看状态码。
#   curl -sI https://weichuan.ziyuanxingqiu.cn/api/companies | grep -iE 'x-content-type-options|x-robots-tag'
#
#   # robots.txt 必须是真文件（text/plain），不能是 SPA 兜底出来的 index.html
#   curl -s -o /dev/null -w '%{content_type}\n' https://weichuan.ziyuanxingqiu.cn/robots.txt
#
# 期望每条都输出四行，缺哪一行就说明对应的 location 漏了声明。
#
# 注意：不要在这里加 Strict-Transport-Security —— HSTS 已经由 Cloudflare 下发
# （max-age=15552000），nginx 再加一遍会变成两个同名的头。
