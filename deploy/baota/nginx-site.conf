# 微传名片 · 宝塔站点 Nginx 配置参考
#
# 用法：在宝塔「网站 → 对应站点 → 配置文件」里，保留宝塔自动生成的
#       listen / ssl_certificate / server_name / root / index 等行，
#       把下面「=== 微传名片 专用 ===」之间的 location 块粘进去即可。
# 后端【不】托管管理端 SPA，所以本机 Nginx 既要托管 dist 静态，又要反代
# /api、/uploads、/healthz 到 Go 二进制（127.0.0.1:8080）。

# ============================================================
# ⚠️ 部署前必做：防火墙只放行 127.0.0.1 访问 8080
# ------------------------------------------------------------
# 后端默认绑定 0.0.0.0:8080（全部网卡，见 backend/cmd/server/main.go）。
# 宝塔 Nginx 从本机 127.0.0.1 反代过去即可；但 8080 若对公网开放，
# 攻击者可绕过 Nginx/TLS 直连后端。必须封掉公网、只留本机。
#
# —— firewalld 环境 ——
# firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="127.0.0.1" port port="8080" protocol="tcp" accept'
# firewall-cmd --permanent --add-rich-rule='rule family="ipv4" port port="8080" protocol="tcp" reject'
# firewall-cmd --reload
#
# —— 无 firewalld（直接 iptables）——
# iptables -I INPUT -p tcp -s 127.0.0.1 --dport 8080 -j ACCEPT
# iptables -A INPUT -p tcp --dport 8080 -j DROP
# （启用 IPv6 时同理加 ip6tables 规则）
#
# 验证：
#   本机：  curl -m 3 http://127.0.0.1:8080/healthz        → 应返回 JSON
#   外部：  curl -m 3 http://<公网IP>:8080/healthz          → 应连接被拒（超时/refused）
# ============================================================

server {
    # ↓↓↓ 以下由宝塔自动生成，请勿删除（SSL 证书在宝塔面板申请并自动填好）↓↓↓
    listen 443 ssl;
    server_name weichuan.ziyuanxingqiu.cn;
    root /www/wwwroot/weichuan/dist;
    # ssl_certificate / ssl_certificate_key 由宝塔填写
    # index index.html;
    # ↑↑↑ 以上由宝塔管理 ↑↑↑

    # === 微传名片 专用：反代后端（127.0.0.1:8080）===
    # 注意：proxy_pass 末尾【不要】带 /，否则会把 /api 前缀剥掉导致 404。
    # X-Forwarded-For / X-Forwarded-Proto 必须透传：后端按可信反代网段
    # （含 127.0.0.1 / 私有网段）采信 XFF 取得真实客户端 IP 做限流。
    #
    # ⚠️ proxy_set_header Host $host 这一行**不能删**（宝塔手工加 location 时最容易漏）：
    #    nginx 的默认值是 $proxy_host，即上游地址 127.0.0.1:8080。后端安装向导的写接口
    #    有同源检查（挡 CSRF），它拿浏览器 Origin 的域名跟收到的 Host 比，一旦 Host 变成
    #    127.0.0.1:8080 就对不上，「测试连接」直接 403 —— 而那时数据库账号密码其实是对的。
    #    漏了这一行远程装不上；没有别的办法，只能改这里再 nginx -s reload。
    #    用 CDN / 负载均衡在同一位置再补一行：
    #        proxy_set_header X-Forwarded-Host $host;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 文件上传 / 素材：同样反代到后端（后端按 UPLOAD_DIR 读盘返回）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点（宝塔「健康检查」/ 监控脚本可用）
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # === SPA 兜底：非 /api、非 /uploads、非 /healthz 的路由都回 index.html ===
    # 必须放在最后；前缀 location 块优先级更高，不会覆盖上面的反代。
    #
    # 漏了这段的典型症状：站内跳转正常，但**刷新页面 / 直接访问任意路由**
    # （/login、/companies、/login?company=xxx …）返回 nginx 404——因为没有
    # 这个文件、又没回退 index.html。用 `curl -sI https://<域名>/login` 可确诊（404 即缺兜底）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
