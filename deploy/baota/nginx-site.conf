# 微传名片 · 宝塔站点 Nginx 配置参考
#
# 用法：在宝塔「网站 → 对应站点 → 配置文件」里，保留宝塔自动生成的
#       listen / ssl_certificate / server_name / root / index 等行，
#       把下面「=== 微传名片 专用 ===」之间的 location 块粘进去即可。
# 后端【不】托管管理端 SPA，所以本机 Nginx 既要托管 dist 静态，又要反代
# /api、/uploads、/healthz 到 Go 二进制（127.0.0.1:8080）。

# ============================================================
# ⚠️ 部署前必做：防火墙只放行 127.0.0.1 访问 8080
# ------------------------------------------------------------
# 后端默认绑定 0.0.0.0:8080（全部网卡，见 backend/cmd/server/main.go）。
# 宝塔 Nginx 从本机 127.0.0.1 反代过去即可；但 8080 若对公网开放，
# 攻击者可绕过 Nginx/TLS 直连后端。必须封掉公网、只留本机。
#
# —— firewalld 环境 ——
# firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="127.0.0.1" port port="8080" protocol="tcp" accept'
# firewall-cmd --permanent --add-rich-rule='rule family="ipv4" port port="8080" protocol="tcp" reject'
# firewall-cmd --reload
#
# —— 无 firewalld（直接 iptables）——
# iptables -I INPUT -p tcp -s 127.0.0.1 --dport 8080 -j ACCEPT
# iptables -A INPUT -p tcp --dport 8080 -j DROP
# （启用 IPv6 时同理加 ip6tables 规则）
#
# 验证：
#   本机：  curl -m 3 http://127.0.0.1:8080/healthz        → 应返回 JSON
#   外部：  curl -m 3 http://<公网IP>:8080/healthz          → 应连接被拒（超时/refused）
# ============================================================

server {
    # ↓↓↓ 以下由宝塔自动生成，请勿删除（SSL 证书在宝塔面板申请并自动填好）↓↓↓
    listen 443 ssl;
    server_name weichuan.ziyuanxingqiu.cn;
    root /www/wwwroot/weichuan.ziyuanxingqiu.cn/frontend;
    # ssl_certificate / ssl_certificate_key 由宝塔填写
    # index index.html;
    # ↑↑↑ 以上由宝塔管理 ↑↑↑

    # === 基础加固 ===
    # 与 frontend/nginx.conf（Docker 路径）保持一致。宝塔默认配置里这三项都没有，
    # 结果就是同一套产品走宝塔部署时少了三个安全头——安全基线不该取决于部署方式。
    #
    # server_tokens off：不回显版本号。`Server: nginx/1.31.7` 等于把「该打哪个 CVE」
    # 直接告诉扫描器。
    # client_max_body_size：企业信息图片 / 相册 / 封面 / 小程序代码包都要过这里。
    # nginx 默认只有 1m，超了直接 413，而前端只会看到一个没头没尾的上传失败。
    # 注意：宝塔面板全局一般也写了 50m，这里再写一遍是为了不依赖面板。
    server_tokens off;
    client_max_body_size 50m;

    # 安全响应头。always = 4xx/5xx 也带，否则错误页反而是最容易被嵌入的那一页。
    # 不加 CSP：Vue 构建产物里有内联样式，一套拍脑袋写出来的 CSP 会直接把页面打白。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 全站是管理后台，没有可索引内容。robots.txt 只挡守规矩的爬虫，
    # 外链/聊天软件预览不看 robots.txt，所以响应头也要标（第三道是 index.html 的 meta）。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # 注意 nginx 的 add_header 继承陷阱：**location 里只要出现任何一个 add_header，
    # 就完全不再继承 server 级的那几个**。所以下面每个带 add_header 的 location
    # 都把这四个头重新声明了一遍——那不是冗余，是必须的。

    # === 微传名片 专用：反代后端（127.0.0.1:8080）===
    # 注意：proxy_pass 末尾【不要】带 /，否则会把 /api 前缀剥掉导致 404。
    # X-Forwarded-For / X-Forwarded-Proto 必须透传：后端按可信反代网段
    # （含 127.0.0.1 / 私有网段）采信 XFF 取得真实客户端 IP 做限流。
    #
    # ⚠️ proxy_set_header Host $host 这一行**不能删**（宝塔手工加 location 时最容易漏）：
    #    nginx 的默认值是 $proxy_host，即上游地址 127.0.0.1:8080。后端安装向导的写接口
    #    有同源检查（挡 CSRF），它拿浏览器 Origin 的域名跟收到的 Host 比，一旦 Host 变成
    #    127.0.0.1:8080 就对不上，「测试连接」直接 403 —— 而那时数据库账号密码其实是对的。
    #    漏了这一行远程装不上；没有别的办法，只能改这里再 nginx -s reload。
    #    用 CDN / 负载均衡在同一位置再补一行：
    #        proxy_set_header X-Forwarded-Host $host;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 文件上传 / 素材：同样反代到后端（后端按 UPLOAD_DIR 读盘返回）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === 健康检查（存活 / 就绪分离）===
    #
    # 后端提供三个端点（见 backend/internal/handler/handler.go）：
    #   /healthz/live   存活：进程能响应就 200，不碰 DB、不碰任何依赖
    #   /healthz/ready  就绪：SELECT 1 探 DB，不可达 503
    #   /healthz[/]     索引页：列出上面两个子端点，恒 200，不做健康判断
    #
    # 监控与编排用 ready，不要用 live，也不要用根路径索引页：live 在 DB 断开时
    # 仍返回 200，根路径索引页更是恒 200 不查任何东西——拿它们告警会漏掉
    # 「进程在但不可用」这一整类故障，而那正是探活存在的意义。
    #
    # ⚠️ 这条 location 有两个「不能带」的斜杠。线上踩过 ERR_TOO_MANY_REDIRECTS
    #    （浏览器报「将您重定向的次数过多」，curl 里一串 301 首尾相接）：
    #
    #   1) location 结尾不能带 /。
    #      写成 `location ^~ /healthz/` 时，Nginx 把它当目录建模，启用内建的
    #      auto_redirect：请求 /healthz 被判定为「该目录的父路径」，自动 301 到
    #      /healthz/。这是内建行为，不在配置文件里，grep 'return 301' / 'rewrite'
    #      永远找不到它，只能靠 curl 观察跳转链。
    #      下面这种不带 / 的写法同时覆盖 /healthz、/healthz/、/healthz/live、
    #      /healthz/ready，且不触发任何目录判定——一条顶四条。
    #
    #   2) proxy_pass 后面不能带任何路径，也不能以 / 结尾。
    #      带 URI 时 Nginx 做前缀替换：location 匹配到的那段被替换成 proxy_pass
    #      里写的 URI。末尾多一个 / 就会让上游收到错误路径
    #      （/healthz/live → /live → 404）。正确写法只有协议 + 主机 + 端口。
    #
    #   3) 别用面板的「反向代理」功能配 healthz。它会把「代理目录」规范化成
    #      healthz/（见生成配置里的 `#PROXY-START/healthz/`），然后给 location
    #      和 proxy_pass 同时补尾斜杠，正好凑齐上面两条错误。面板配出来的形态
    #      修不好（把目标URL 改成不带路径，它又会生成 proxy_pass ...:8080/，
    #      把 /healthz/ 前缀替换成 /，上游收到 / 直接 404）。只能手写这一段。
    #
    # 为什么 /api/ 同样的写法不出事：它永远带子路径（/api/card 前缀替换后仍是
    # /api/card），既碰不到 auto_redirect 的父路径判定，多出的斜杠也落不到末尾。
    # 只有「请求路径恰好等于反代前缀」的端点才会显形——/healthz 就是典型。
    #
    # 超时压到 2s：探活本该快速失败。用默认 60s 时，后端假死会让告警延迟一分钟。
    #
    # 验证（两条都要看。状态码 200 但 body 是 HTML，说明被下面的 SPA 兜底接走了，
    # 健康检查实际没工作——这个坑比 301 更隐蔽）：
    #   curl -sSI https://<域名>/healthz/ready | head -1   → 200
    #   curl -sS  https://<域名>/healthz/ready             → {"status":"ok","db":"up"}
    location ^~ /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # === 传输优化：gzip + 静态资源缓存 ===
    #
    # ⚠️ 先纠正一个容易搞错的判断依据：宝塔的 gzip **不在站点配置文件里**，
    # 在面板的 `性能调整 → gzip` 全局开关（写进 nginx.conf 的 http 块）。
    # 本机那台面板是**开着**的，线上实测用户可见响应确实带 `content-encoding: gzip`，
    # 首屏 6 个请求合计约 451KB（原始体积约 1.1MB）。
    # 所以「慢」不是缺 gzip 造成的——只看站点配置就断言「没压缩」是错的，
    # 判断依据必须是 `curl -sSI --compressed <url>` 里的 content-encoding。
    #
    # 那这段为什么还留着？两个作用：
    #   1) 兜底：换机器 / 重装面板 / 有人把全局开关关了，站点级 gzip 仍然生效。
    #   2) 真正省的是 **Cloudflare→回源** 那一段：缓存 MISS 时（每次发版后
    #      的第一批用户）回源要搬 1.1MB，压缩后约 380KB，跨地域回源差别明显。
    #      用户侧的体积早就被 CF 压缩过了，这段对最终体积没有额外收益。
    #
    # 注意 nginx 的 gzip_types 是「重新定义即覆盖」而不是追加：
    # 这里写了列表，就会盖掉面板全局那份。所以要保证这里的类型不少于全局，
    # 否则等于把全局开了的类型又关回去。只列文本类；png/jpg/webp/mp4/woff2
    # 这类本来就压缩过的不要列，体积几乎不变只是白烧 CPU。
    # 若想彻底不动全局行为，把这一整段删掉也完全可用。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # 构建产物文件名带内容 hash（内容变则文件名变），可以放心永久缓存。
    # 不加这个头时浏览器每次刷新都要发一次校验请求（304），几十个资源就是
    # 几十次往返；加了 immutable 之后连 304 都省了，直接从内存/磁盘命中。
    #
    # 用正则 location：它优先于下面的 `location /`，所以 /assets/ 下不存在的
    # 文件会正常 404，而不是掉进 try_files 被兜成 index.html ——
    # 「缺失的 js 返回 HTML」会让浏览器报一个跟真实原因毫无关系的 MIME 错误。
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header 继承陷阱：本 location 一旦有 add_header，server 级的安全头就
        # 全都不再继承。故原样重声明（缺了就是「静态资源上没有 nosniff」）。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # SPA 壳 index.html 反过来：绝不能缓存，它引用的是带 hash 的资源文件名，
    # 发版后必须立刻失效，否则用户会拿旧壳去加载已被删除的旧资源（白屏）。
    # 精确匹配优先级最高，try_files 的内部重写也会落到这里。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # 同上，安全头需重声明。首页恰恰是最需要 X-Frame-Options 的那一页。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # === SPA 兜底：非 /api、非 /uploads、非 /healthz 的路由都回 index.html ===
    # 必须放在最后；前缀 location 块优先级更高，不会覆盖上面的反代。
    #
    # 漏了这段的典型症状：站内跳转正常，但**刷新页面 / 直接访问任意路由**
    # （/login、/companies、/login?company=xxx …）返回 nginx 404——因为没有
    # 这个文件、又没回退 index.html。用 `curl -sI https://<域名>/login` 可确诊（404 即缺兜底）。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
