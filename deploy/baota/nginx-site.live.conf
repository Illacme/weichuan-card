# 微传名片 · 线上站点配置（最终版）
#
# 来源：2026-10-29 从服务器上取回的实际配置（宝塔生成 + 我们加的缓存/安全头段），
#       逐行核对后修正。与 deploy/baota/nginx-site.conf 的区别：
#       那个是带长注释的「参考版」，这个是「可直接整体替换」的实际配置。
#
# 用法：宝塔面板 → 网站 → weichuan.ziyuanxingqiu.cn → 设置 → 配置文件，
#       整体替换后保存（宝塔会自动 nginx -t + reload）。
#
# 本次改动（都在下面用 ⚠️ 标出）：
#   1. 删掉 nginx 的 HSTS（与 Cloudflare 重复，两个不同的 max-age 并存）
#   2. ssl_protocols 去掉 TLSv1.1（RFC 8996 已废弃）
#   3. ssl_ciphers 去掉 3DES（Sweet32）
#   4. 新增 80 → 443 强制跳转（CF 只管走 CF 的流量，直连源站 80 是明文）
#   5. index 去掉 php、注释 enable-php-00.conf（本站不跑 PHP）
#   6. 注释 error_page 404（dist 里没有 404.html）
#   7. 新增 real_ip 段 + 手写 /healthz、/api/、/uploads/ 反代（不再依赖面板生成）
#   8. /uploads/ 按「文件名会不会变」拆成两条：wxacode/ 不缓存，其余 immutable 长缓存（1 年）
#   9. 注释面板反代 include（文件里两处都注释）与无鉴权的 /purge 端点
#  10. 全站 X-Robots-Tag: noindex（配套 frontend/public/robots.txt 与 index.html 的 meta）
#  11. SPA 兜底改为「仅浏览器导航（Accept 含 text/html）才回落 index.html 壳」——
#     其余（XHR/fetch、扫描器、缺失静态资源）一律 404，不再兜成 index.html 返回 200。
#     修掉老问题：未匹配路径返回 200 会让扫描器对 /.env、/auth.json 误判「找到文件」、
#     缺失 js 返回 HTML 触发 MIME 错、日志被污染。深链刷新（/login、/console/companies）
#     仍是 200 壳，前端路由不受影响。已脱离面板伪静态（不再 include 面板 rewrite 文件）。
#
# 已验证（2026-10-29，nginx 1.31.7 + ngx_http_realip_module，桩后端）：
#   nginx -t 通过；75 项行为断言全绿 —— healthz 四路径均打到后端、80→301、
#   /api/ 与 /uploads/ 带三个安全头、real_ip 改写 remote_addr 且伪造 XFF 被丢弃、
#   /assets/ immutable、/index.html no-cache、/uploads/wxacode/ no-cache、
#   缺失 assets 返回 404 而非 HTML、TLS 1.0/1.1 被拒、敏感文件 404、
#   robots.txt 是 text/plain 真文件、7 条路径都带 X-Robots-Tag；
#   以及 §7.5：/auth.json 等非 HTML 请求 → 404、裸 curl 深链 → 404、
#   浏览器导航的 /login 与 /console/companies → 200 + SPA 壳。
#   校验脚本在 ~/nginx-check/{gen_site.py,verify.sh}，生成目标为 conf.d/site.conf
#   （nginx.conf 经 docker 挂为 /etc/nginx/nginx.conf，include /cfg/conf.d/*.conf）。
#   注意：桩版把面板 include 换成了本地文件，线上替换前仍需按下面 ⚠️ 的说明先删面板条目。

# === 仅允许 Cloudflare 回源（geo + $realip_remote_addr，兼容 real_ip）===
#
# 为什么不用 `allow/deny`：本站点开了 real_ip（见下），它会把 $remote_addr 改写成
# 真实访客 IP；而 nginx 的 allow/deny 匹配的就是 $remote_addr —— 「来自 CF 的请求」
# 被改写成了访客 IP，反而落进 deny 被拒。**开了 real_ip 就不能用 allow/deny 限 CF。**
#
# 正确做法：geo 基于 $realip_remote_addr（TCP 对端原始 IP = CF 边缘，不受 real_ip 改写
# 影响）判断。CF 边缘 → 1，其它（含直连源站的攻击者）→ 0。
# 127.0.0.1 / ::1 放行，否则本机 `curl -k https://127.0.0.1/` 自检也会 403。
# CF 网段会变，与下面 real_ip 段保持一致，定期核对 https://www.cloudflare.com/ips-v4|v6。
# 注意：geo 必须放在 http 级（server 块外面）；本文件被 Baota 在 http{} 内 include，
# 所以写在 server 之前即可。
geo $realip_remote_addr $is_cf {
    default          0;
    127.0.0.1        1;
    ::1              1;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name weichuan.ziyuanxingqiu.cn;
    # ⚠️ 已改：去掉 index.php / default.php。本站是纯静态 SPA + Go 反代，不跑 PHP。
    index index.html index.htm;
    root /www/wwwroot/weichuan.ziyuanxingqiu.cn/frontend;

    # === 安全响应头（server 级）===
    # 覆盖 /api/ /uploads/ /healthz 和 SPA 兜底这些「自己没有 add_header」的路径。
    # 注意：location 里只要出现任何一个 add_header，server 级这一组就整组失效——
    # 所以下面每个带 add_header 的 location 里都重复声明了同一组，别删任何一处。
    # 不变量：**任何响应都带这 4 个头**，verify.sh 逐路径断言的就是这条。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 全站是管理后台，没有可索引内容。robots.txt 只能挡住守规矩的爬虫，
    # 外链、聊天软件预览这类抓取不看 robots.txt，所以响应头也要标。
    # 注意 CF 不会改写这个头，但会在 HIT 上重写 Cache-Control（见 /uploads/ 注释）。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ⚠️ 新增：80 端口强制跳 HTTPS。
    # Cloudflare 的 Always Use HTTPS 只管「经过 CF 的流量」；源站 80 若对公网开放，
    # 直连 IP:80 会拿到明文内容。CF 回源走 443，所以这个 if 对正常访问不触发。
    # 注：Let's Encrypt 的 HTTP-01 验证会跟随 301 跳转，不影响宝塔自动续期；
    #     万一哪天续期失败，先注释这三行排查。
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/weichuan.ziyuanxingqiu.cn.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/weichuan.ziyuanxingqiu.cn/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/weichuan.ziyuanxingqiu.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/weichuan.ziyuanxingqiu.cn/privkey.pem;
    # ⚠️ 已改：去掉 TLSv1.1。RFC 8996 已废弃 TLS 1.0/1.1，且与已开启的 HSTS 自相矛盾
    #    （HSTS 强制走 HTTPS，却允许用已被攻破的协议版本协商）。
    ssl_protocols TLSv1.2 TLSv1.3;
    # ⚠️ 已改：去掉 EECDH+3DES / RSA+3DES。3DES 分组长度 64 位，Sweet32 可在线恢复明文。
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ⚠️ 已删：add_header Strict-Transport-Security "max-age=31536000";
    #   HSTS 统一由 Cloudflare 下发（当前 max-age=15552000 = 6 个月）。
    #   保留会有两个问题：
    #     ① 线上实测这个头已经被 CF 覆盖掉了（浏览器只收到 15552000），
    #        说明它现在并不起作用，留着只是让人误以为生效；
    #     ② 万一 CF 不再覆盖，浏览器会收到两个值不同的 HSTS 头，RFC 6797 要求
    #        只处理第一个、忽略其余 —— 到底取哪个不确定。
    #   要升到 1 年，在 CF 面板改（SSL/TLS → Edge Certificates → HSTS），改一处即可。
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    # ⚠️ 已注释：dist 里没有 404.html，这条只会让每个 404 多一次无效的内部跳转。
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #清理缓存规则
    # ⚠️ 已注释：本站没有任何 location 使用 proxy_cache，这条 purge 端点是死代码；
    #   而它本身是个**无鉴权**的入口（任何人 GET /purge/<uri> 都能清缓存）。
    #   以后真要开 proxy_cache，再连同 `proxy_cache_path ... keys_zone=cache_one`
    #   一起加回来，并给它加上来源限制。
    #location ~ /purge(/.*) {
    #    proxy_cache_purge cache_one $host$1$is_args$args;
    #}
    #引用反向代理规则，注释后配置的反向代理将无效
    # ⚠️ 已注释：这一行是「面板反代条目」的总开关，必须在启用手写的
    #   /healthz、/api/、/uploads/ 之前关掉，否则两边都定义 location /api/，
    #   nginx 直接报 `duplicate location "/api/"` 拒绝启动（线上真实踩过）。
    #   宝塔原文在文件里给过两处这行 include，现在都已注释 —— 只注释一处会漏。
    #include /www/server/panel/vhost/nginx/proxy/weichuan.ziyuanxingqiu.cn/*.conf;

    # ⚠️ 已注释：本站不跑 PHP。
    #   留着它意味着任何 .php 请求都会交给 php-fpm 执行；而 /uploads/ 下是用户可上传
    #   的文件，后端白名单万一漏了某个扩展名，就是一条直通 RCE 的路。
    #   纯静态 + Go 反代不需要这一行。
    #include enable-php-00.conf;
    #PHP-INFO-END

    # === 真实客户端 IP：让 $remote_addr 变成访客 IP，而不是 Cloudflare 边缘节点 IP ===
    #
    # 不配这一段会连锁出三个问题（线上实测都出现过）：
    #   ① 限流按「CF 边缘 IP」分桶 —— CF 边缘有几十个地址，同一攻击者的请求会散落到
    #      不同桶里，每个桶都凑不满阈值，于是**限流形同虚设**（实测 16 次错误密码无一拦截）。
    #   ② 审计日志里记的全是 CF 的 IP，出事查不到是谁。
    #   ③ 后端 Gin 的 ClientIP() 拿到的是「XFF 里最右边那个不可信地址」= CF 边缘 IP。
    #
    # real_ip 只采信**来自下面这些网段**的 CF-Connecting-IP，所以直连源站的伪造请求无效。
    # 网段会变，定期核对：https://www.cloudflare.com/ips-v4 和 /ips-v6
    # 需要 ngx_http_realip_module（宝塔默认编译进去了，核对：nginx -V 2>&1 | grep realip）
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # === 仅允许 Cloudflare 回源：非 CF 来源一律 403 ===
    # 现状痛点：源站 443 对全网开放，直连 `curl -k https://<源站IP>/ -H 'Host: <域名>'`
    # 能拿 200，CF 的 WAF / 限流 / Bot 管理 / 缓存全被绕过，等于没有。
    # 上面 geo 块把 $realip_remote_addr（CF 边缘 IP）映射成 $is_cf=1；直连源站的攻击者
    # 其 TCP 对端是真实 IP、不在 CF 网段 → $is_cf=0 → 这里 403。
    # 放在 80→443 跳转之前：非 CF 的 HTTP 直连也直接拒，不帮攻击者做跳转。
    # 本机自检（127.0.0.1 / ::1）已在 geo 里放行，不受影响。
    # 回滚：把下面这 3 行注释掉，nginx -s reload 即可，不会把自己锁在外面。
    if ($is_cf = 0) {
        return 403;
    }

    # === 后端反代 ===
    #
    # 这三段是手写的，不再依赖宝塔面板「反向代理」生成的文件。原因：
    #   - 面板生成的是 `location = /healthz`（精确匹配），/healthz/live 和 /healthz/ready
    #     全掉进 SPA 兜底返回 HTML + 200 —— 监控永远绿，这是线上真实踩过的坑；
    #   - 面板生成的 /api/ 里带 add_header，把 server 级的安全头组（nosniff / X-Frame /
    #     Referrer-Policy / X-Robots-Tag 四个）整组顶掉了。
    #
    # ⚠️ 启用这三段之前，必须先关掉「面板反代条目」的总开关 ——
    #    也就是上面 PHP-INFO 段里那行 `include .../proxy/weichuan.ziyuanxingqiu.cn/*.conf;`
    #    （已在原位置注释）。只注释本段这一处是不够的，文件里出现过两次。
    #    删面板条目前先看清楚原来代理了哪些路径：
    #      cat /www/server/panel/vhost/nginx/proxy/weichuan.ziyuanxingqiu.cn/*.conf
    #
    #    实测（nginx 1.31.7）：真正会撞的是 `/api/` 和 `/uploads/` 这两条**普通前缀**，
    #    报错形如 `duplicate location "/api/" in ...:229`（229 就是下面这条 location /api/）。
    #    面板那条 `location = /healthz`（精确匹配）与下面的 `^~ /healthz` 类型不同，
    #    **不会**报错、可以共存 —— 但精确匹配优先级更高，裸 /healthz 会走面板那条
    #    （没有 2s 超时）。要么一起删，要么接受这点差异。

    # 健康检查：必须用 `^~ /healthz`（前缀），**不能带尾斜杠，也不能用 `=`**
    #   - 带尾斜杠 `location ^~ /healthz/`：nginx 把它当目录建模，对 /healthz 触发内建
    #     auto_redirect（301 到 /healthz/），与后端 Gin 的 RedirectTrailingSlash 互踢成死循环；
    #   - 用 `= /healthz`：只覆盖裸路径，子端点全掉进 try_files 变成 index.html（线上现状）。
    # proxy_pass 后面**不能带任何路径或尾斜杠**，否则上游收到被替换过的路径。
    location ^~ /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：追加会把客户端自带的 XFF 原样留在左侧，后端取到伪造值
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 探活本该快速失败；用默认 60s 时后端假死会让告警延迟一分钟
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # 小程序代码上传：同步执行、分钟级（编译 + 传代码都在这一次请求里跑完）。
    # 若落到下面 60s 的 /api/ 会中途 504，而代码可能已经传到微信了 —— 前端看到失败、
    # 后台没有 draft 记录，运营再点一次就撞「版本号已占用」。
    # 必须是正则 location 且写在 /api/ 之前；/api/ 用普通前缀（不带 ^~）才能让正则先生效。
    location ~ ^/api/admin/companies/[0-9]+/releases/upload$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # ⚠️ 这两行都不能删：Host 变成 127.0.0.1:8080 会让安装向导的同源检查 403。
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加 —— 理由见上面 real_ip 段。追加时客户端自带的 XFF 会被后端采信，
        # 伪造头就能绕过登录限流（也就等于超管口令可无限爆破）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # === 用户上传文件：必须按「文件名会不会变」分两种策略 ===
    #
    # 后端有两条落盘路径，URL 语义完全不同：
    #   - storage.Save()      → RandName() 生成 32 位随机 hex（storage.go:61），
    #                           URL 与内容一一对应、永不覆盖 → 可以长缓存
    #   - storage.SaveBytes() → 调用方给固定路径（storage.go:92），其中
    #                           wxacode/<staffID>.jpg 在重新生成小程序码时**原地覆盖**
    #                           → 长缓存会让员工扫到已经作废的旧码
    #
    # 宝塔模板把这两类混成一条 `expires 1m`：对头像类资源等于没缓存（每次刷新回源），
    # 对小程序码又刚好够用。这里拆开。

    # 小程序码：key 固定、内容可变，必须每次回源校验。
    # 用 `^~` 让它在前缀匹配阶段就命中，不再往下看正则。
    location ^~ /uploads/wxacode/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache" always;
        # add_header 继承陷阱：本 location 有 add_header，server 级的安全头整组失效，
        # 故原样重声明（下面每个带 add_header 的 location 都要重复一遍）。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # 其余上传：文件名是随机 hex（或 library/<素材ID>.<ext>，重复采用内容不变），
    # 内容寻址、URL 与内容一一对应、永不覆盖 —— 事实不可变，直接给 1 年 + immutable，
    # 比早期保守的 7 天更彻底（immutable 让浏览器连 304 校验都省掉）。
    #
    # 用普通前缀（不带 ^~）：这样上面那些「敏感文件 404」的正则 location 仍然先生效，
    # /uploads/xxx.sql、/uploads/.env 这类仍然被拦，不会因为反代而漏过去。
    #
    # 注：走 Cloudflare 时这个头会被 CF 的 Browser Cache TTL（默认 4 小时）覆盖成
    # max-age=14400。要让 1 年 + immutable 真的透传到浏览器，得在 CF 侧把 Browser Cache TTL
    # 改成「Respect Existing Headers」，或给 /uploads/* 加一条 Cache Rule（Edge/Browser TTL 设长或 Respect Existing）。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # 构建产物文件名带内容 hash（内容变则文件名变），可以放心永久缓存。
    # 不加这个头时浏览器每次刷新都要发一次校验请求（304），几十个资源就是
    # 几十次往返；加了 immutable 之后连 304 都省了，直接从内存/磁盘命中。
    #
    # 用正则 location：它优先于 SPA 兜底，所以 /assets/ 下不存在的文件会正常 404，
    # 而不是被兜成 index.html ——「缺失的 js 返回 HTML」会让浏览器报一个
    # 跟真实原因毫无关系的 MIME 错误。
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header 继承陷阱：本 location 有 add_header，server 级的安全头就整组失效，
        # 故原样重声明。缺了就是「静态资源上没有 nosniff」。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # SPA 壳 index.html 反过来：绝不能缓存，它引用的是带 hash 的资源文件名，
    # 发版后必须立刻失效，否则用户会拿旧壳去加载已被删除的旧资源（白屏）。
    # 精确匹配优先级最高，index 指令与 try_files 的内部重写都会落到这里。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # === SPA 兜底（自管理，已脱离面板伪静态）===
    #
    # 原来 `location / { try_files $uri $uri/ /index.html; }` 写在宝塔「伪静态」模板里、靠
    # include 引入。问题：所有未匹配路径（含 /auth.json、/.env、缺失的 js）都返回
    # index.html + 200，导致① 扫描器对敏感路径看到 200（误报「找到文件」）② 缺失资源返回
    # HTML 让浏览器报跟真实原因无关的 MIME 错误 ③ 日志被污染。
    #
    # 修复：只有「浏览器导航请求」（Accept 含 text/html）才回落到 index.html 壳子，
    # 其余（XHR/fetch、扫描器、缺失静态资源）一律 404。这样：
    #   - 深链接 /login、/admin/companies/123 刷新仍正常（前端路由接管）；
    #   - /.env、/auth.json、/firebase-config.json 等返回 404，扫描器不再看到 200；
    #   - 缺失 /assets/*.js 本来就被 `location ~* ^/assets/` 拦成 404，不受影响。
    #
    # 已脱离面板：下面不再 include 伪静态文件。宝塔「伪静态」里若再选模板会重新插入
    # `location / { try_files ... }`，与本段重复 → nginx 启动失败。要改伪静态就改这里，别碰面板那项。
    # 注意：本段必须放在所有具体 location（/api/、/uploads/、/assets/、= /index.html、
    # 敏感文件正则）之后、access_log 之前；前缀 `location /` 优先级最低，具体路径仍先命中各自 location。
    location / {
        try_files $uri $uri/ @spa;
    }

    # 兜底命名 location：靠 Accept 头区分「浏览器导航」与「其它请求」。
    # 裸 `curl https://域名/`（Accept: */*）现在会 404 —— 这是预期行为，健康检查请打 /healthz。
    location @spa {
        # 浏览器导航（Accept 含 text/html）→ 回落 SPA 壳，交给 `= /index.html` 处理（带 no-cache + 安全头）
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        # 其余（XHR/fetch、扫描器、缺失资源）→ 真 404，不再兜成 index.html
        return 404;
    }

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/weichuan.ziyuanxingqiu.cn.log;
    error_log  /www/wwwlogs/weichuan.ziyuanxingqiu.cn.error.log;
}
