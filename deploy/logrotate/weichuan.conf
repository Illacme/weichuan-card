# 微传名片 · 日志轮转（仅适用于**非容器**部署、服务日志直接写文件的情况）
#
# 容器部署不要装这个：docker 的 json-file 驱动自己有轮转，已在
# docker-compose.yml 里配成 max-size=10m / max-file=7（改完要 --force-recreate）。
#
# 用法：
#   sudo cp deploy/logrotate/weichuan.conf /etc/logrotate.d/weichuan
#   sudo logrotate -d /etc/logrotate.d/weichuan   # 先演练（-d 只打印不执行）
#
# 两个必须留的参数：
#   copytruncate  服务是把日志**追加**写到同一个文件句柄上的，用默认的
#                 create（改名+新建）会让它继续往已被改名的旧文件里写，
#                 于是「轮转了但磁盘没释放」，直到哪天把根分区写满。
#   compress      日志文本压缩率通常 >10 倍，留 14 天也没多少；
#                 delaycompress 是给「服务还握着刚轮转出来的 .1 文件」留一手。
#
# 注意：轮转只解决「本机磁盘」，不解决「日志能不能被查到」——
#      要查历史日志得上集中日志（见 deploy/promtail/config.yml）。

/var/log/weichuan/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    create 0640 root adm
}
